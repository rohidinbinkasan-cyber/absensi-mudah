/* ---------------------------- Compact date-range formatting ----------------------------
   Renders a range like "Senin, 3 - 9 Agu 2026" (same month), "Sen, 29 Jun - Sel, 7 Jul 2026"
   (spans months, same year), or falls back to two full dates when the years differ. */
function fmtDateRangeID(fromIso, toIso){
  if(!fromIso || !toIso) return '';
  if(fromIso===toIso) return fmtDateID(fromIso);
  const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const dFrom = new Date(fromIso+'T00:00:00');
  const dTo = new Date(toIso+'T00:00:00');
  const sameMonth = dFrom.getMonth()===dTo.getMonth() && dFrom.getFullYear()===dTo.getFullYear();
  const sameYear = dFrom.getFullYear()===dTo.getFullYear();
  if(sameMonth){
    return days[dFrom.getDay()]+', '+dFrom.getDate()+' - '+dTo.getDate()+' '+months[dTo.getMonth()]+' '+dTo.getFullYear();
  } else if(sameYear){
    return days[dFrom.getDay()]+', '+dFrom.getDate()+' '+months[dFrom.getMonth()]+' - '+days[dTo.getDay()]+', '+dTo.getDate()+' '+months[dTo.getMonth()]+' '+dTo.getFullYear();
  }
  return fmtDateID(fromIso)+' - '+fmtDateID(toIso);
}
function fmtHijriRangeID(fromIso, toIso){
  if(!fromIso || !toIso) return '';
  if(fromIso===toIso) return fmtHijri(fromIso);
  const dFrom = new Date(fromIso+'T00:00:00');
  const dTo = new Date(toIso+'T00:00:00');
  const hFrom = gregorianToHijri(dFrom);
  const hTo = gregorianToHijri(dTo);
  if(hFrom.month===hTo.month && hFrom.year===hTo.year){
    return hFrom.day+' - '+hTo.day+' '+(HIJRI_MONTHS[hTo.month-1]||'')+' '+hTo.year+' H';
  } else if(hFrom.year===hTo.year){
    return hFrom.day+' '+(HIJRI_MONTHS[hFrom.month-1]||'')+' - '+hTo.day+' '+(HIJRI_MONTHS[hTo.month-1]||'')+' '+hTo.year+' H';
  }
  return fmtHijri(fromIso)+' - '+fmtHijri(toIso);
}

/* ---------------------------- Hijri (Islamic) calendar ----------------------------
   Tabular Islamic calendar conversion (civil epoch). This is a well-known
   arithmetic approximation — it can differ by 1 day from the officially
   announced date (which depends on local moon-sighting), so it is shown as
   an estimate ("perkiraan"). No internet connection required. */
const HIJRI_MONTHS = ['Muharram','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab',"Sya'ban",'Ramadhan','Syawal',"Dzulqa'dah",'Dzulhijjah'];
function gregorianToJDN(y,m,d){
  const a = Math.floor((14-m)/12);
  const y2 = y + 4800 - a;
  const m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
function jdnToHijri(jdn){
  const epoch = 1948440; // JDN of 1 Muharram 1 AH (tabular/civil)
  let l = jdn - epoch + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return {year, month, day};
}
function gregorianToHijri(d){ return jdnToHijri(gregorianToJDN(d.getFullYear(), d.getMonth()+1, d.getDate())); }
function fmtHijri(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  const h = gregorianToHijri(d);
  const monthName = HIJRI_MONTHS[h.month-1] || '';
  return h.day+' '+monthName+' '+h.year+' H';
}

function fmtRp(n){

  return 'Rp' + v.toLocaleString('id-ID');

function sessionInfo(){
  try{
    const raw = sessionStorage.getItem('mda_session');
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(s && s.role) return s;
    return {role:'admin'}; // backward compat: nilai lama '1' = admin
  }catch(e){ return null; }
}
function isTeacher(){ const s = sessionInfo(); return !!(s && s.role==='guru'); }
function isAdmin(){ const s = sessionInfo(); return !!(s && s.role==='admin'); }
function isGuest(){ const s = sessionInfo(); return !!(s && s.role==='tamu'); }
function roleLabel(){ return isTeacher() ? 'Guru' : (isGuest() ? 'Tamu / Wali Santri' : 'Admin'); }
function allowedView(v){
  if(isTeacher()) return ['dashboard','input','recap','share','finance','poto','barcodes'].includes(v) ? v : 'dashboard';
  if(isGuest()) return ['dashboard','poto','recap','finance','share'].includes(v) ? v : 'dashboard';
  return v; // admin: everything
}
function canManageFinance(){ return isAdmin() || isTeacher(); }

function applyTheme(){
  const t = appSettings().theme || 'green';
  document.documentElement.setAttribute('data-theme', t==='green' ? '' : t);
  applyBackground();
}
function applyBackground(){
  const s = appSettings();
  const layer = document.getElementById('bgLayer');
  if(!layer) return;
  const bgImg = sanitizeUrl(s.bgImage);
  const bgColor = sanitizeColor(s.bgColor);
  if(bgImg){
    layer.style.backgroundImage = `linear-gradient(rgba(251,248,241,.88),rgba(251,248,241,.88)), url("${bgImg}")`;
    layer.style.backgroundSize = 'cover';
    layer.style.backgroundPosition = 'center';
    layer.style.backgroundRepeat = 'no-repeat';
    layer.style.backgroundColor = bgColor;
  } else if(bgColor){
    layer.style.backgroundImage = 'none';
    layer.style.backgroundColor = bgColor;
  } else {
    layer.style.backgroundImage = '';
    layer.style.backgroundSize = '';
    layer.style.backgroundPosition = '';
    layer.style.backgroundRepeat = '';
    layer.style.backgroundColor = '';
  }
}
function logoOrMoon(sizePx, borderRadius){
  const p = profile();
  const sz = sizePx || 22;
  const logo = sanitizeUrl(p.logo);
  if(logo){
    return `<img src="${logo}" alt="" style="width:${sz}px;height:${sz}px;border-radius:${borderRadius||'50%'};object-fit:cover;display:block;">`;
  }
  return moonSvg(sz);
}

/* ---------- Input suara (speech-to-text) ---------- */
/* Memasang tombol mic di pinggir field teks bila browser mendukung Web Speech
   API. Tidak melakukan apa-apa (tanpa tombol) bila tidak didukung. */
function attachVoiceInput(inputId, opts){
  const el = document.getElementById(inputId);
  if(!el || el.dataset.micAttached === '1') return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  el.dataset.micAttached = '1';
  const lang = (opts && opts.lang) || 'id-ID';
  const wrap = document.createElement('div');
  wrap.className = 'field-voice-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const mic = document.createElement('button');
  mic.type = 'button';
  mic.className = 'mic-btn icon-btn';
  mic.setAttribute('aria-label', 'Input suara');
  mic.setAttribute('title', 'Input suara');
  mic.innerHTML = icon('mic');
  wrap.appendChild(mic);
  let recog = null;
  const setActive = (on)=>{
    mic.dataset.active = on ? '1' : '0';
    mic.innerHTML = icon(on ? 'micoff' : 'mic');
    if(on) showToast('Mendengarkan…', 'info');
  };
  mic.addEventListener('click', ()=>{
    if(!recog){
      try{
        recog = new SR();
        recog.lang = lang;
        recog.continuous = false;
        recog.interimResults = false;
        recog.onresult = (e)=>{
          const txt = ((e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript) || '').trim();
          if(txt){
            const cur = el.value || '';
            el.value = cur ? cur + ' ' + txt : txt;
            el.dispatchEvent(new Event('input', {bubbles:true}));
          }
        };
        recog.onerror = (e)=>{
          const map = {
            'not-allowed':'Izin mikrofon ditolak — aktifkan di pengaturan browser.',
            'service-not-allowed':'Izin mikrofon ditolak — aktifkan di pengaturan browser.',
            'no-speech':'Tidak ada suara terdeteksi, coba lagi.',
            'network':'Koneksi bermasalah — coba lagi.',
            'audio-capture':'Mikrofon tidak ditemukan.',
            'aborted':'',
          };
          const msg = map[e.error];
          if(msg) showToast(msg, 'error');
        };
        recog.onend = ()=>{ setActive(false); };
      }catch(err){
        showToast('Input suara tidak tersedia di browser ini.', 'error');
        return;
      }
    }
    if(mic.dataset.active === '1'){
      try{ recog.stop(); }catch(err){}
      setActive(false);
      return;
    }
    setActive(true);
    try{ recog.start(); }catch(err){ setActive(false); }
  });
}

  'Bengkulu':7,'Lampung':7,'Kepulauan Bangka Belitung':7,'Kepulauan Riau':7,'DKI Jakarta':7,

function tzFromProvince(name){
  if(!name) return null;
  const norm = String(name).trim().toLowerCase().replace(/^provinsi\s+/, '').replace(/^d\.i\.\s+/, '');
  for(const k in PROVINCE_TZ){ if(k.toLowerCase() === norm) return PROVINCE_TZ[k]; }
  return null;
}
function tzFromLng(lng){ return lng < 115 ? 7 : (lng < 128 ? 8 : 9); }
function prayerTz(pr){
  pr = pr || ((appSettings()||{}).prayer) || {};
  if(pr.tzOffset === 7 || pr.tzOffset === 8 || pr.tzOffset === 9) return pr.tzOffset;
  const pv = tzFromProvince(pr.province);
  if(pv) return pv;
  const lng = pr.lng ? parseFloat(String(pr.lng).replace(',','.')) : NaN;
  if(isFinite(lng)) return tzFromLng(lng);
  return 7;
}
function localPrayerNow(){
  const tz = prayerCity().tzOffset;
  const t = new Date(Date.now() + tz*3600*1000);
  return { y:t.getUTCFullYear(), mo:t.getUTCMonth()+1, d:t.getUTCDate(), h:t.getUTCHours(), mi:t.getUTCMinutes(), s:t.getUTCSeconds() };
}
function wibDateISO(){ const n=localPrayerNow(); return n.y+'-'+String(n.mo).padStart(2,'0')+'-'+String(n.d).padStart(2,'0'); }

function prayerCity(){
  const s = appSettings() || {};
  const pr = s.prayer || {};
  const city = PRAYER_CITIES.find(c=>c.id===pr.city) || PRAYER_CITIES[0];
  const lat = pr.lat ? parseFloat(String(pr.lat).replace(',','.')) : city.lat;
  const lng = pr.lng ? parseFloat(String(pr.lng).replace(',','.')) : city.lng;
  return { id:city.id, name:city.name, lat, lng, method:pr.method || 'kemenag', tzOffset:prayerTz(pr), label:pr.label || city.name, province:pr.province || '', gpsAttrib:!!pr.gpsAttrib };
}
function pf(a){ a = a - 360*Math.floor(a/360); return a<0 ? a+360 : a; }
function ph(a){ a = a - 24*Math.floor(a/24); return a<0 ? a+24 : a; }
function sunPos(jd){
  const d = jd - 2451545.0;
  const g = pf(357.529 + 0.98560028*d);
  const q = pf(280.459 + 0.98564736*d);
  const L = pf(q + 1.915*Math.sin(g*Math.PI/180) + 0.020*Math.sin(2*g*Math.PI/180));
  const e = 23.439 - 0.00000036*d;
  const RA = Math.atan2(Math.cos(e*Math.PI/180)*Math.sin(L*Math.PI/180), Math.cos(L*Math.PI/180))*180/Math.PI/15;
  return { decl: Math.asin(Math.sin(e*Math.PI/180)*Math.sin(L*Math.PI/180))*180/Math.PI, eqt: q/15 - ph(RA) };
}
function ha(angle, lat, decl){
  const num = Math.sin(angle*Math.PI/180) - Math.sin(lat*Math.PI/180)*Math.sin(decl*Math.PI/180);
  const den = Math.cos(lat*Math.PI/180)*Math.cos(decl*Math.PI/180);
  const v = Math.min(1, Math.max(-1, num/den));
  return Math.acos(v)*180/Math.PI/15;
}
function prayerTimesFor(lat, lng, methodId, y, mo, d, tz){
  const m = PRAYER_METHODS[methodId] || PRAYER_METHODS.kemenag;
  const jd = (Date.UTC(y, mo-1, d)/86400000) + 2440587.5 - lng/360;
  const sp = sunPos(jd);
  const noon = ph(12 - sp.eqt - lng/15 + (tz==null ? 7 : tz));
  const fajr = ph(noon - ha(-m.fajr, lat, sp.decl));
  const sunrise = ph(noon - ha(-0.833, lat, sp.decl));
  const dhuhr = ph(noon + m.dhuhr/60);
  const asrAng = 90 - Math.atan(m.asr + Math.tan(Math.abs((lat - sp.decl)*Math.PI/180)))*180/Math.PI;
  const asr = ph(noon + ha(asrAng, lat, sp.decl));
  const sunset = ph(noon + ha(-0.833, lat, sp.decl));
  const maghrib = m.maghribIsAngle ? ph(noon + ha(-m.maghrib, lat, sp.decl)) : ph(sunset + m.maghrib/60);
  const isha = m.ishaIsAngle ? ph(noon + ha(-m.isha, lat, sp.decl)) : ph(maghrib + m.isha/60);
  return { fajr, sunrise, dhuhr, asr, maghrib, isha };
}
function hhmm(h){ const t=Math.round(h*60); const H=Math.floor(t/60)%24, M=t%60; return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }
function prayerListFor(dateISO){
  const parts = String(dateISO).split('-').map(Number);
  if(parts.length!==3) return null;
  const loc = prayerCity();
  if(!isFinite(loc.lat) || !isFinite(loc.lng)) return null;
  const t = prayerTimesFor(loc.lat, loc.lng, loc.method, parts[0], parts[1], parts[2], loc.tzOffset);
  return { loc, items:[
    {k:'Subuh', t:t.fajr}, {k:'Terbit', t:t.sunrise}, {k:'Dzuhur', t:t.dhuhr}, {k:'Ashar', t:t.asr}, {k:'Maghrib', t:t.maghrib}, {k:'Isya', t:t.isha}
  ]};
}
function nextPrayer(list){
  const n = localPrayerNow();
  const nowMin = n.h*60 + n.mi + n.s/60;
  for(const it of list.items){ if(it.t*60 > nowMin) return { it, waitMin: it.t*60 - nowMin }; }
  return { it: list.items[0], waitMin: 24*60 - nowMin + list.items[0].t*60 };
}
function fmtCountdown(min){
  if(min < 1) return 'segera';
  if(min < 60) return 'dlm '+Math.ceil(min)+' mnt';
  const h=Math.floor(min/60), m=Math.round(min%60);
  return 'dlm '+h+' j'+(m>0?' '+m+' mnt':'');
}

function socLink(type, value){
  const v = (value==null?'':String(value)).trim();

  if(type==='tiktok') return 'https://www.tiktok.com/@'+encodeURIComponent(h);
  if(type==='youtube') return 'https://www.youtube.com/@'+encodeURIComponent(h);
  if(type==='facebook') return 'https://www.facebook.com/'+encodeURIComponent(h);
  if(type==='instagram') return 'https://www.instagram.com/'+encodeURIComponent(h);
  return '';
}
let __prayerTimer = null;
function bindPrayerClock(){
  const el = document.getElementById('prayerClock');
  if(!el) return;
  if(__prayerTimer) return;
  const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  __prayerTimer = setInterval(()=>{
    const c = document.getElementById('prayerClock');
    const d = document.getElementById('prayerDate');
    const g = document.getElementById('prayerGrid');
    if(!c){ clearInterval(__prayerTimer); __prayerTimer = null; return; }
    const n = localPrayerNow();
    c.textContent = String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0')+':'+String(n.s).padStart(2,'0');
    if(d){
      const ut = new Date(Date.now() + prayerCity().tzOffset*3600*1000);
      d.textContent = dayNames[ut.getUTCDay()]+', '+fmtDateID(wibDateISO());
    }
    const list = prayerListFor(wibDateISO());
    if(list){
      const next = nextPrayer(list);
      const nm = document.getElementById('prayerNextName');
      const tm = document.getElementById('prayerNextTime');
      const ct = document.getElementById('prayerNextCount');
      if(nm) nm.textContent = next.it.k;
      if(tm) tm.textContent = hhmm(next.it.t);
      if(ct) ct.textContent = fmtCountdown(next.waitMin);
    }
    if(g && App.prayerExpanded && list){
      const next = nextPrayer(list);
      const html = list.items.map(it=>{
        const isNext = next.it===it;
        return `<div class="prayer-item ${isNext?'now':''}"><span class="prayer-name">${it.k}</span><span class="prayer-time">${hhmm(it.t)}</span>${isNext?`<span class="prayer-next">${fmtCountdown(next.waitMin)}</span>`:''}</div>`;
      }).join('');
      if(g.innerHTML !== html) g.innerHTML = html;
    }
  }, 1000);
  const tgl = document.getElementById('prayerToggle');
  if(tgl){
    tgl.addEventListener('click', ()=>{
      App.prayerExpanded = !App.prayerExpanded;
      const wrap = document.getElementById('prayerWrap');
      const lbl = document.getElementById('prayerToggleLbl');
      if(wrap) wrap.classList.toggle('open', App.prayerExpanded);
      tgl.classList.toggle('open', App.prayerExpanded);
      if(lbl) lbl.textContent = App.prayerExpanded ? 'Sembunyikan' : 'Lihat semua jadwal';
    });
  }
}

/* ---------- Deteksi lokasi (GPS) + reverse geocode untuk jadwal sholat ---------- */
let __geoBusy = false;
function prayerUseGps(){
  if(__geoBusy) return;
  if(!('geolocation' in navigator)){ showToast('Lokasi (GPS) tidak didukung di browser ini.', 'error'); return; }
  __geoBusy = true;
  const btn = document.getElementById('prGpsBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = icon('location')+' Mendeteksi…'; }
  const done = (msg, type)=>{ __geoBusy = false; if(btn){ btn.disabled = false; btn.innerHTML = icon('location')+' Deteksi Lokasi Sekarang (GPS)'; } if(msg) showToast(msg, type); render(); };
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const lat = +pos.coords.latitude.toFixed(6);
    const lng = +pos.coords.longitude.toFixed(6);
    const pr = Object.assign({}, (appSettings().prayer || {}));
    pr.city = 'custom'; pr.lat = lat; pr.lng = lng;
    pr.tzOffset = null; pr.province = ''; pr.label = ''; pr.gpsAttrib = false;
    try{
      const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1&accept-language=id';
      const res = await fetch(url);
      const j = await res.json();
      const a = (j && j.address) || {};
      const prov = a.state || a.state_district || '';
      const tz = tzFromProvince(prov);
      if(tz) pr.tzOffset = tz;
      pr.province = prov;
      pr.gpsAttrib = true;
      const parts = [a.village||a.hamlet||a.suburb||a.town||a.city||'', a.county||a.municipality||a.city_district||'', a.state||''];
      pr.label = parts.filter(Boolean).join(', ') || (lat.toFixed(5)+', '+lng.toFixed(5));
    }catch(e){
      pr.label = lat.toFixed(5)+', '+lng.toFixed(5);
      pr.tzOffset = tzFromLng(lng);
    }
    const s = appSettings(); s.prayer = pr; saveAppSettings(s);
    done('Lokasi terdeteksi: '+pr.label, 'success');
  }, (err)=>{
    const msg = err.code===1 ? 'Izin lokasi ditolak — aktifkan di pengaturan browser.'
      : err.code===2 ? 'Lokasi tidak dapat ditentukan saat ini.'
      : err.code===3 ? 'Waktu deteksi lokasi habis — coba lagi.'
      : 'Gagal mendeteksi lokasi.';
    done(msg, 'error');
  }, { enableHighAccuracy:true, timeout:10000 });
}

function bindGlobal(){
  updateConnIndicator();
  bindConnEvents();
  bindShortcuts();
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-nav');
      if(id==='more'){ App.sheetOpen = true; render(); return; }
      if(id==='logout'){ sessionStorage.removeItem('mda_session'); API.setToken(null); App.loginOpen=false; render(); return; }
      if(id==='login'){ App.sheetOpen = false; App.loginOpen = true; render(); return; }
      if(id==='shareapp'){ App.sheetOpen = false; render(); shareAppWithData(); return; }
      App.view = id; App.sheetOpen = false; render();
    });
  });
  document.querySelectorAll('[data-close-sheet]').forEach(el=>{
    el.addEventListener('click', ()=>{ App.sheetOpen=false; render(); });
  });
  if(!window.__mdaResizeBound){
    window.__mdaResizeBound = true;
    // Re-render saat resize HANYA bila lebar layar benar-benar melewati batas
    // tata letak mobile ↔ desktop (900px). Pemicu resize lain — mis. keyboard
    // Android yang membuka/menutup (mengubah tinggi viewport) — TIDAK memicu
    // render. Sebelumnya resize keyboard memicu render, DOM di-render ulang,
    // input yang sedang diketik hancur & kehilangan fokus, keyboard menutup,
    // resize lagi → render lagi → loop "kembali terus" sehingga teks tidak bisa
    // diketik di HP Android.
    let lastDesktop = window.innerWidth >= 900;
    window.addEventListener('resize', debounce(()=>{
      const nowDesktop = window.innerWidth >= 900;
      if(nowDesktop !== lastDesktop){
        lastDesktop = nowDesktop;
        render();
      }
    }, 250));
  }
bindFinConfirm();
  NavIndicator.sync();
  bindHeroCounters();
  bindHeaderScroll();
}

/* Animasi angka hero (counter ringan) — hanya saat kartu masuk viewport */
function bindHeroCounters(){
  const nums = document.querySelectorAll('.hero-stat .num[data-count]');
  if(!nums.length) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const animate = (el)=>{
    const target = parseInt(el.getAttribute('data-count'),10) || 0;
    if(reduce || !('requestAnimationFrame' in window)){ el.textContent = String(target); return; }
    const dur = 900, t0 = performance.now();
    const tick = (t)=>{
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(target * eased));
      if(p < 1) requestAnimationFrame(tick); else el.textContent = String(target);
    };
    requestAnimationFrame(tick);
  };
  if(!('IntersectionObserver' in window)){ nums.forEach(animate); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ animate(en.target); io.unobserve(en.target); } });
  }, { threshold:.3 });
  nums.forEach(n=>io.observe(n));
}
/* Header: perkuat blur+shadow ketika halaman di-scroll */
function bindHeaderScroll(){
  const apply = ()=>{
    const hdr = document.getElementById('appHeader');
    if(hdr) hdr.classList.toggle('is-scrolled', (window.scrollY || document.documentElement.scrollTop || 0) > 4);
  };
  if(!window.__mdaScrollBound){
    window.__mdaScrollBound = true;
    window.addEventListener('scroll', apply, { passive:true });
    window.addEventListener('resize', apply, { passive:true });
  }
  apply();
}

function viewDashboard(){
  const cls = classes();

  const selClassId = App.dashClassId || '';
  const dateRec = att[selDate] || {};
  const isToday = selDate===todayISO();
  const curClass = cls.find(c=>c.id===selClassId);

  const classesInScope = selClassId ? cls.filter(c=>c.id===selClassId) : cls;

  let H=0,S=0,I=0,A=0, markedClassIds=new Set();
  const absentList = []; // {name, className, classId, status}
  classesInScope.forEach(c=>{
    const recs = dateRec[c.id] || {};
    let any=false;
    const classStudents = st.filter(s=>s.classId===c.id && s.active!==false);
    classStudents.forEach(s=>{
      const v = recs[s.id];
      if(v){
        any=true;
        if(v==='H')H++; else if(v==='S')S++; else if(v==='I')I++; else if(v==='A')A++;
        if(v!=='H') absentList.push({name:s.name, className:c.name, classId:c.id, status:v});
      }
    });
    if(any) markedClassIds.add(c.id);
  });
  const ABSENT_SORT_ORDER = {A:0, I:1, S:2};
  absentList.sort((a,b)=>(ABSENT_SORT_ORDER[a.status]??9)-(ABSENT_SORT_ORDER[b.status]??9) || a.name.localeCompare(b.name));
  const unmarked = classesInScope.filter(c=>{
    const count = st.filter(s=>s.classId===c.id && s.active!==false).length;

/* =========================================================================
   ABSENSI SELFIE (foto santri)
   Pencocokan wajah sederhana tanpa server: gambar dipangkas ke bagian tengah,
   dikecilkan ke 8x8 grayscale, lalu dibandingkan dengan foto referensi santri.
   ========================================================================= */
let pendingPhoto = null; // foto referensi yang sedang dipilih di modal santri
function resizeImageFile(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      const scale = Math.min(1, maxSize/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.75));
    };
    img.onerror = ()=> showToast('Gagal membaca gambar.', 'error');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function legacyGetUserMedia(constraints){
  return new Promise((res, rej)=>{
    const api = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
    if(!api) return rej(new Error('API kamera tidak tersedia'));
    api.call(navigator, constraints, res, rej);
  });
}
async function startSelfieCamera(){
  const v = document.getElementById('selfieVideo');
  const ph = document.getElementById('selfiePlaceholder');
  const cap = document.getElementById('selfieCaptureBtn');
  const st = document.getElementById('selfieStatus');
  if(!v) return;
  // Coba beberapa cara: kamera depan → kamera belakang → tanpa pilihan kamera → API lama.
  // Setiap percobaan diberi batas waktu agar WebView yang menggantung (tidak punya kamera)
  // tidak membuat aplikasi macet di "Menyiapkan kamera…".
  const timed = (fn, ms) => Promise.race([fn(), new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  let stream = null;
  let hung = false;
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      stream = await timed(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false}), 8000);
    }catch(e){ stream = null; hung = !!(e && e.message==='timeout'); }
    if(!stream && !hung){
      try{ stream = await timed(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:640}, height:{ideal:480}}, audio:false}), 3000); }catch(e){ stream = null; }
    }
    if(!stream && !hung){
      try{ stream = await timed(()=>navigator.mediaDevices.getUserMedia({video:true, audio:false}), 3000); }catch(e){ stream = null; }
    }
  }
  if(!stream && !hung){
    try{ stream = await legacyGetUserMedia({video:true, audio:false}); }catch(e){ stream = null; }
  }
  if(stream && stream.getVideoTracks && stream.getVideoTracks().length){
    window.__selfieStream = stream;
    v.srcObject = stream;
    await v.play().catch(()=>{});
    if(ph) ph.style.display = 'none';
    if(cap) cap.style.display = '';
    if(st) st.textContent = 'Kamera siap — anak menghadap ke kamera lalu ketuk "Ambil Foto dari Kamera Langsung".';
  } else {
    if(ph) ph.innerHTML = '<div><b>Kamera langsung tidak tersedia di browser ini.</b><br><span style="font-size:11px; opacity:.8;">Ketuk <b style="color:var(--gold-400);">"Buka Kamera"</b> — aplikasi kamera ponsel akan terbuka otomatis.</span></div>';
    if(cap) cap.style.display = 'none';
    if(st) st.textContent = 'Gunakan tombol "Buka Kamera" di bawah — kamera ponsel terbuka otomatis dan bisa diganti depan/belakang.';
  }
}

function loadImageDataUrl(src){

/* ---------------------------- Pencocokan wajah selfie (diperkuat) ----------------------------
   Fitur: (1) luminansi 24×24 dinormalisasi z-score (tahan perubahan pencahayaan), (2) gradien
   tepi horizontal+vertikal (menonjolkan bentuk wajah), (3) histogram warna 4×4×4 (tahan warna
   baju/latar). Skor akhir = 50% luminansi + 30% tepi + 20% warna. Potongan gambar diprioritaskan
   ke bagian atas (wajah) karena foto referensi & selfie umumnya wajah di atas-tengah. */
const SELFIE_GRID = 24;
function zscoreVec(v){
  const o = new Float32Array(v.length);
  let m=0; for(let i=0;i<v.length;i++) m+=v[i]; m/=v.length;
  let s=0; for(let i=0;i<v.length;i++){ const d=v[i]-m; s+=d*d; } s=Math.sqrt(s/v.length);
  if(s<1e-4) return o; // gambar seragam → vektor nol (netral)
  for(let i=0;i<v.length;i++) o[i]=(v[i]-m)/s;
  return o;
}
async function imageVector(src){
  const im = await loadImageDataUrl(src);
  const N = SELFIE_GRID;
  // potong persegi dari bagian atas gambar (wajah biasanya di sana)
  const side = Math.min(im.width, Math.round(im.height*0.72));
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');
  c.drawImage(im, Math.round((im.width-side)/2), 0, side, side, 0, 0, N, N);
  const d = c.getImageData(0,0,N,N).data;
  const lum = new Float32Array(N*N);
  const hist = new Float32Array(64); // histogram RGB 4×4×4
  for(let i=0;i<N*N;i++){
    const j=i*4, r=d[j], g=d[j+1], b=d[j+2];
    lum[i] = 0.299*r + 0.587*g + 0.114*b;
    hist[(Math.min(3,r>>6))*16 + (Math.min(3,g>>6))*4 + Math.min(3,b>>6)]++;
  }
  let hs=0; for(let i=0;i<64;i++) hs+=hist[i];
  if(hs>0) for(let i=0;i<64;i++) hist[i]/=hs;
  const hg = new Float32Array(N*N), vg = new Float32Array(N*N);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    hg[y*N+x] = lum[y*N+Math.min(N-1,x+1)] - lum[y*N+Math.max(0,x-1)];
    vg[y*N+x] = lum[Math.min(N-1,y+1)*N+x] - lum[Math.max(0,y-1)*N+x];
  }
  const edges = new Float32Array(N*N*2);
  edges.set(hg,0); edges.set(vg,N*N);
  return { lum: zscoreVec(lum), edges: zscoreVec(edges), color: hist };
}
function normalizeVec(v){
  let s=0; for(const x of v) s+=x*x; s=Math.sqrt(s)||1;
  const o=new Float32Array(v.length); for(let i=0;i<v.length;i++) o[i]=v[i]/s;
  return o;
}
function cosSim(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function featuresSimilarity(a,b){
  return 0.5*cosSim(normalizeVec(a.lum), normalizeVec(b.lum))
       + 0.3*cosSim(normalizeVec(a.edges), normalizeVec(b.edges))
       + 0.2*cosSim(normalizeVec(a.color), normalizeVec(b.color));
}

async function runSelfieMatch(dataUrl){
  const res = document.getElementById('selfieResult');
  if(!res) return;
  const st = students().filter(s=>s.classId===App.inputClassId && s.active!==false && s.photo);
  if(st.length===0){ res.innerHTML = `<div class="alert">${icon('alert')} <div>Belum ada santri berfoto di kelas ini. Tambahkan foto di Data Santri terlebih dahulu.</div></div>`; return; }
  res.innerHTML = '<p style="font-size:12.5px; color:var(--ink-soft);">Mencocokkan foto…</p>';
  let sv;
  try{ sv = await imageVector(dataUrl); }
  catch(e){ res.innerHTML = '<div class="alert">Gagal membaca foto. Coba lagi.</div>'; return; }
  const scored = [];
  for(const s of st){
    try{ scored.push({s, sim: featuresSimilarity(sv, await imageVector(s.photo))}); }catch(e){}
  }
  scored.sort((a,b)=>b.sim-a.sim);
  if(!scored.length){ res.innerHTML = '<div class="alert">Tidak ada foto yang bisa dicocokkan. Coba lagi.</div>'; return; }
  const best = scored[0];
  const second = scored[1] ? scored[1].sim : 0;
  const pct = Math.round(best.sim*100);
  // Ambang: dikenali bila skor tinggi, ATAU jelas lebih baik dari kandidat kedua (margin)
  const THRESHOLD = 68;
  const confident = pct >= THRESHOLD && (pct >= 85 || (pct - Math.round(second*100)) >= 4);
  let html = '';
  if(confident){
    html += `<div class="alert" style="background:var(--green-50); border-color:var(--green-700); color:var(--green-900);">${icon('check')} <div><b>Dikenali: ${escapeHtml(best.s.name)}</b>Kemiripan ${pct}% — ketuk tombol untuk menandai Hadir.</div></div>`;
  } else {
    html += `<div class="alert">${icon('alert')} <div><b>Tidak dikenali dengan yakin (${pct}%)</b>Pilih santri yang benar dari daftar, atau coba foto ulang.</div></div>`;
  }
  html += `<div class="card" style="margin:0 0 10px;">` + scored.slice(0,3).map((x,i)=>`
    <div class="list-row">
      <div class="avatar" style="overflow:hidden; padding:0;">${x.s.photo?`<img src="${sanitizeUrl(x.s.photo)}" style="width:100%;height:100%;object-fit:cover;">`:(i+1)}</div>
      <div class="list-main"><div class="t1">${escapeHtml(x.s.name)}</div><div class="t2">kemiripan ${Math.round(x.sim*100)}%</div></div>
      <button class="btn btn-primary btn-sm" data-selfie-mark="${x.s.id}">${icon('check')} Hadir</button>
    </div>`).join('') + `</div>`;
  html += `<button class="btn btn-outline btn-block" id="selfieRetry">${icon('camera')} Foto Ulang</button>`;
  res.innerHTML = html;
  document.querySelectorAll('[data-selfie-mark]').forEach(b=>b.addEventListener('click', ()=>{ markSelfieStudent(b.getAttribute('data-selfie-mark')); }));
  const retry = document.getElementById('selfieRetry');

}

/* =========================================================================
   ABSEN VIA BARCODE
   Barcode Code 128 (Code Set B) — tabel pola & algoritma dari JsBarcode
   (lisensi MIT), cocok dibaca BarcodeDetector Chrome/Android (code_128, dll).
   Pemindaian kamera memakai API BarcodeDetector bawaan browser; bila tidak
   tersedia, guru bisa mengetik nomor barcode secara manual. Data barcode
   tersimpan di tiap santri (s.bcode) sehingga ikut dalam backup & file
   "Bagikan Aplikasi" otomatis.
   ========================================================================= */
const CODE128_BARS = [
  11011001100, 11001101100, 11001100110, 10010011000, 10010001100,
  10001001100, 10011001000, 10011000100, 10001100100, 11001001000,
  11001000100, 11000100100, 10110011100, 10011011100, 10011001110,
  10111001100, 10011101100, 10011100110, 11001110010, 11001011100,
  11001001110, 11011100100, 11001110100, 11101101110, 11101001100,
  11100101100, 11100100110, 11101100100, 11100110100, 11100110010,
  11011011000, 11011000110, 11000110110, 10100011000, 10001011000,
  10001000110, 10110001000, 10001101000, 10001100010, 11010001000,
  11000101000, 11000100010, 10110111000, 10110001110, 10001101110,
  10111011000, 10111000110, 10001110110, 11101110110, 11010001110,
  11000101110, 11011101000, 11011100010, 11011101110, 11101011000,
  11101000110, 11100010110, 11101101000, 11101100010, 11100011010,
  11101111010, 11001000010, 11110001010, 10100110000, 10100001100,
  10010110000, 10010000110, 10000101100, 10000100110, 10110010000,
  10110000100, 10011010000, 10011000010, 10000110100, 10000110010,
  11000010010, 11001010000, 11110111010, 11000010100, 10001111010,
  10100111100, 10010111100, 10010011110, 10111100100, 10011110100,
  10011110010, 11110100100, 11110010100, 11110010010, 11011011110,
  11011110110, 11110110110, 10101111000, 10100011110, 10001011110,
  10111101000, 10111100010, 11110101000, 11110100010, 10111011110,
  10111101110, 11101011110, 11110101110, 11010000100, 11010010000,
  11010011100, 1100011101011
];
function code128Bits(text){
  const START_B = 104, STOP = 106;
  let checksum = START_B;
  const values = [];
  for(let i=0;i<text.length;i++){
    const v = text.charCodeAt(i) - 32; // Code Set B: ASCII 32–126
    if(v < 0 || v > 95) return null;
    values.push(v);
    checksum += v * (i+1);
  }
  checksum %= 103;
  let bits = String(CODE128_BARS[START_B]);
  values.forEach(v=>{ bits += String(CODE128_BARS[v]); });
  bits += String(CODE128_BARS[checksum]);
  bits += String(CODE128_BARS[STOP]);
  return bits;
}
function drawBarcode(canvas, text){
  const bits = code128Bits(text);
  if(!bits) return;
  const module = 2, quiet = 10, height = 56;
  const w = (bits.length + quiet*2) * module;
  canvas.width = w; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, height);
  ctx.fillStyle = '#1C2B24';
  let x = quiet * module;
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1') ctx.fillRect(x, 0, module, height);
    x += module;
  }
}
function paintBarcodes(root){
  (root || document).querySelectorAll('canvas[data-bcode]').forEach(cv=>{
    const v = cv.getAttribute('data-bcode');
    if(v) drawBarcode(cv, v);

}
function bcodeOf(s){
  return s && s.bcode ? String(s.bcode) : '';
}
/* Barcode dihasilkan DARI FOTO santri: kode pendek (8 karakter hex) hasil SHA-256 dari
   data foto. Foto sama → kode sama; foto diganti → kode ikut berubah, jadi barcode selalu
   terikat ke foto santri. Tanpa foto → memakai NIS; tanpa NIS → kode acak MDAxxxx.
   Hasil hash disimpan dalam cache per sesi agar render tetap cepat (foto yang tidak
   berubah tidak pernah di-hash ulang). */
const __photoBcodeCache = new Map();
function barcodeFromPhoto(dataUrl){
  let hex = __photoBcodeCache.get(dataUrl);
  if(!hex){
    hex = sha256Fallback(new TextEncoder().encode(dataUrl)).slice(0, 8).toUpperCase();
    __photoBcodeCache.set(dataUrl, hex);
  }
  return hex;
}
function ensureStudentBarcodes(){
  let list = students();
  let changed = false;
  const used = new Set();
  list.forEach(s=>{ if(s.bcode) used.add(String(s.bcode).toUpperCase()); });
  list.forEach(s=>{
    if(s.photo){
      const derived = barcodeFromPhoto(s.photo); // dari cache bila foto belum berubah
      if(s.bcode && String(s.bcode).toUpperCase()===derived) return; // sudah cocok dengan foto
      used.delete(String(s.bcode).toUpperCase()); // kode lama santri ini diganti → lepas dari daftar
      let v = derived, k = 0;
      while(used.has(v)){ v = derived + (k++); } // pastikan unik terhadap santri lain
      s.bcode = v;
      changed = true;
    } else {
      if(s.bcode) return; // tanpa foto: kode lama dipertahankan
      let v = s.nis ? String(s.nis).trim().toUpperCase() : '';
      if(!v || used.has(v)){ do { v = 'MDA' + Math.floor(1000 + Math.random()*9000); } while(used.has(v)); }
      s.bcode = v;
      changed = true;
    }
    used.add(String(s.bcode).toUpperCase());
  });
if(changed) Store.set('students', list, true);
}
/* QR Code santri: payload = JSON pendek {"id":"<id unik santri>"} (QR TIDAK memuat foto —
   kapasitas QR terbatas; foto & QR tetap dua elemen visual terpisah di kartu). Payload
   dibuat OTOMATIS saat data santri disimpan (ensureStudentQrs dipanggil dari render(),
   yang selalu berjalan setelah save) dan di-cache di s.qrData agar ikut backup/bagikan
   aplikasi. id santri stabil → QR tidak berubah saat foto diganti. */
function qrcodeOf(s){
  return (s && s.qrData) ? String(s.qrData) : JSON.stringify({id: (s && s.id) || ''});
}

/* Render QR payload ke <canvas data-qr> memakai qrcode-generator (embedded, offline).
   Ukuran module dibuat bulat & grid di-center supaya tajam saat dicetak/di-scan. */
function drawQr(canvas, payload){
  if(!canvas || !payload) return;
  try{
    const qr = qrcode(0, 'Q');
    qr.addData(payload);
    qr.make();
    const n = qr.getModuleCount();
    const size = canvas.offsetWidth || canvas.clientWidth || 128;
    const quiet = 4;
    const total = n + quiet*2;
    const cell = Math.max(1, Math.floor(size / total));
    const grid = cell * total;
    const off = Math.floor((size - grid) / 2);
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#1C2B24';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) ctx.fillRect(off + (c+quiet)*cell, off + (r+quiet)*cell, cell, cell);
    }
  }catch(e){}
}
function paintQrCodes(root){
  (root || document).querySelectorAll('canvas[data-qr]').forEach(cv=>{
    const v = cv.getAttribute('data-qr');
    if(v) drawQr(cv, v);
  });
}
/* Mencocokkan hasil scan QR: payload {"id":"..."} → santri dengan id tsb (kelas mana pun,
   asal aktif). Tidak dikenali → null (jangan ubah data apapun). */
function findStudentByQrPayload(value){

  return null;
}

let __barcodeStream = null;
let __barcodeFacing = 'environment';
let __barcodeScanning = false;
let __barcodeLastValue = null;
let __barcodeLastTime = 0;
function startBarcodeCamera(){
  const v = document.getElementById('barcodeVideo');
  const ph = document.getElementById('barcodePlaceholder');
  const st = document.getElementById('barcodeStatus');
  if(!v) return;
  const timed = (fn, ms) => Promise.race([fn(), new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  const facings = [__barcodeFacing, __barcodeFacing==='environment' ? 'user' : 'environment', null];
  let stream = null;
  (async ()=>{
    for(const facing of facings){
      if(stream) break;
      const cons = facing ? {video:{facingMode:facing, width:{ideal:960}, height:{ideal:720}}, audio:false} : {video:true, audio:false};
      try{
        if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) stream = await timed(()=>navigator.mediaDevices.getUserMedia(cons), facing ? 5000 : 3000);
        else if(!stream){ try{ stream = await legacyGetUserMedia({video:true, audio:false}); }catch(e){} }
      }catch(e){ stream = null; }
    }
    if(stream && stream.getVideoTracks && stream.getVideoTracks().length){
      __barcodeStream = stream;
      v.srcObject = stream;
      await v.play().catch(()=>{});
      if(ph) ph.style.display = 'none';
if(st) st.textContent = qrScanSupported()
        ? 'Kamera siap — arahkan kartu QR santri ke dalam kotak kamera.'
        : 'Browser ini tidak mendukung pemindaian kamera. Gunakan "Ketik Nomor" di bawah, atau buka di Chrome Android.';
      startBarcodeScanning();
    } else {
      if(ph) ph.innerHTML = '<div><b>Kamera langsung tidak tersedia di browser ini.</b><br><span style="font-size:11px; opacity:.8;">Ketik nomor barcode santri secara manual di bawah.</span></div>';
      if(st) st.textContent = 'Pemindaian kamera tidak tersedia — gunakan kolom "Ketik Nomor" di bawah.';
    }
  })();
}
function stopBarcodeCamera(){
  __barcodeScanning = false;
  const sl = document.getElementById('barcodeScanline');
  if(sl) sl.style.display = 'none';
  const v = document.getElementById('barcodeVideo');
  if(v && v.srcObject){ try{ v.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){} v.srcObject = null; }
  if(__barcodeStream){ try{ __barcodeStream.getTracks().forEach(t=>t.stop()); }catch(e){} __barcodeStream = null; }
}
/* jsQR fallback: dipakai bila BarcodeDetector bawaan browser tidak tersedia
   (mis. Firefox/Safari). Frame video disalin ke canvas kecil lalu didecode. */
let __qrFallbackCanvas = null;
let __qrFallbackCtx = null;
function jsQrAvailable(){ return typeof window.jsQR === 'function'; }
function qrScanSupported(){ return barcodeDetectorOK() || jsQrAvailable(); }
function jsQrScanFrame(v){
  try{
    if(!__qrFallbackCanvas){
      __qrFallbackCanvas = document.createElement('canvas');
      __qrFallbackCtx = __qrFallbackCanvas.getContext('2d', {willReadFrequently:true});
    }
    const w = Math.min(v.videoWidth || 640, 1280);
    const h = Math.max(1, Math.round(w * (v.videoHeight || 480) / (v.videoWidth || 640)));
    __qrFallbackCanvas.width = w; __qrFallbackCanvas.height = h;
    __qrFallbackCtx.drawImage(v, 0, 0, w, h);
    const img = __qrFallbackCtx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, {inversionAttempts: 'dontInvert'});
    if(code && code.data) handleBarcodeDetected(code.data);
  }catch(e){}
}
function startBarcodeScanning(){
  if(__barcodeScanning || !qrScanSupported()) return;
  __barcodeScanning = true;
  const sl = document.getElementById('barcodeScanline');
  if(sl) sl.style.display = '';
  const loop = async ()=>{
    if(!__barcodeScanning) return;
    const v = document.getElementById('barcodeVideo');
    if(v && v.videoWidth){
      if(barcodeDetectorOK()){
        try{
          const codes = await __barcodeDetector.detect(v);
          if(codes && codes.length) handleBarcodeDetected(codes[0].rawValue);
        }catch(e){}
      } else {
        jsQrScanFrame(v);
      }
    }
    setTimeout(loop, 150);
  };
  loop();
}
function findStudentByBarcode(value){
  const v = String(value||'').trim().toUpperCase();
  if(!v) return null;
  const all = students();
  return all.find(x=>x.classId===App.inputClassId && x.active!==false && String(x.bcode||'').toUpperCase()===v)
      || all.find(x=>x.active!==false && String(x.bcode||'').toUpperCase()===v)
      || null;
}
function handleBarcodeDetected(raw, manual){
  const value = String(raw||'').trim(); // TIDAK di-uppercase: payload QR {"id":"..."} harus dibaca apa adanya
  if(!value) return;
  const now = Date.now();
  if(!manual && value===__barcodeLastValue && now-__barcodeLastTime < 2500) return; // cegah pindai ganda berturut-turut
  __barcodeLastValue = value;
  __barcodeLastTime = now;
const s = findStudentByQrPayload(value) || findStudentByBarcode(value);
  const res = document.getElementById('barcodeResult');
  if(!res) return;
  if(!s){
    res.innerHTML = `<div class="alert">${icon('alert')} <div><b>QR/Kode "${escapeHtml(value)}" tidak dikenali</b>Bukan milik santri mana pun — data tidak diubah. Periksa kartunya, atau cek kartu QR di tab Absensi.</div></div>`;
    return;
  }
  // Sudah pernah absen di tanggal ini → peringatan, JANGAN input ganda
  const existing = ((attendance()[App.inputDate]||{})[s.classId]||{})[s.id];
  if(existing){
    vibrate(90);
    beep(440, 160);
    res.innerHTML = renderAlreadyScannedCard(s, existing);
    const inp = document.getElementById('barcodeManualInput');
    if(inp && manual) inp.value = '';
    return;
  }
  markBarcodeStudent(s.id, 'H');
  vibrate(60);
  beep(880, 140);
  const cls = classes().find(c=>c.id===s.classId);
  res.innerHTML = renderBarcodeResultCard(s, cls ? cls.name : '');
  const inp = document.getElementById('barcodeManualInput');
  if(inp && manual) inp.value = '';
  const st = document.getElementById('barcodeStatus');
  if(st && qrScanSupported()) st.textContent = 'Pindai kartu berikutnya — status santri bisa diubah lewat tombol di atas.';
}
/* Kartu peringatan saat QR/kode santri sudah tercatat hari ini (hindari double-input). */

  return `<svg class="bcard-seal" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#C9A227" stroke-width="2.2"/>

    ${dusun ? `<text font-family="Amiri, 'Plus Jakarta Sans', serif" font-size="8.5" font-weight="700" fill="#0B6B4F" letter-spacing="5"><textPath href="#mdaSealBot" startOffset="50%" text-anchor="middle">${escapeHtml(dusun)}</textPath></text>` : ''}
    <circle cx="50" cy="50" r="6.5" fill="#C9A227"/>

function computeRange(period, customFrom, customTo, refDate){
  if(period==='daily'){
    const day = customFrom || todayISO();
    return {from:day, to:day};
  }
  if(period==='custom'){
    let from = customFrom || App.recapCustomFrom || todayISO();
    let to = customTo || App.recapCustomTo || todayISO();
    if(from>to){ const tmp=from; from=to; to=tmp; }
    return {from, to};
  }
  const today = new Date();
  if(period==='weekly'){
    const ref = refDate ? new Date(refDate+'T00:00:00') : today;
    const from = startOfWeek(ref);
    const end = new Date(from); end.setDate(end.getDate()+6);
    const to = end < today ? end : today;
    return {from:isoOf(from), to:isoOf(to)};
  }
  let from, to=new Date(today);
  if(period==='monthly'){ from = new Date(today.getFullYear(), today.getMonth(), 1); }
  else { from = new Date(today.getFullYear(), 0, 1); }
  return {from:isoOf(from), to:isoOf(to)};
}
function statsForStudent(studentId, classId, from, to){
  const att = attendance();
  const cfg = statusConfig();
  const counts = {}; cfg.forEach(c=>counts[c.key]=0);
  let total=0;
  Object.keys(att).forEach(dateIso=>{
    if(dateIso<from || dateIso>to) return;
    const cRec = (att[dateIso]||{})[classId];
    if(!cRec) return;
    const v = cRec[studentId];
    if(v){ counts[v]=(counts[v]||0)+1; total++; }
  });
  return {counts, total};
}

function recapTableHTML(){
  const rows = App._recapRows || [];
  const cfg = statusConfig();
  const q = (App.recapSearch||'').trim().toLowerCase();
  const filtered = q
    ? rows.filter(r=>r.name.toLowerCase().indexOf(q)!==-1 || (r.nis||'').toLowerCase().indexOf(q)!==-1)
    : rows;
  if(filtered.length===0){
    return `<div class="empty">${icon('recap')}<b>${rows.length===0 ? 'Belum ada data' : 'Tidak ada hasil pencarian'}</b>${rows.length===0 ? 'Pilih kelas/santri dan pastikan absensi sudah diisi.' : 'Coba kata kunci lain atau bersihkan pencarian.'}</div>`;
  }
  const PAGE_SIZE = 50;
  const pages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  const page = Math.min(Math.max(1, App.recapPage || 1), pages);
  App.recapPage = page;
  const slice = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const trs = slice.map((r,idx)=>{
    const no = (page-1)*PAGE_SIZE + idx + 1;
    return `
        <tr style="border-bottom:1px solid var(--line);">

        </tr>`;
  }).join('');
  const pager = filtered.length>PAGE_SIZE ? `
    <div class="recap-pager">
      <button class="btn btn-outline btn-sm" id="recapPrev" ${page<=1?'disabled':''}>${icon('input')} Sebelumnya</button>
      <span>${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE, filtered.length)} dari ${filtered.length}</span>
      <button class="btn btn-outline btn-sm" id="recapNext" ${page>=pages?'disabled':''}>Berikutnya ${icon('input')}</button>
    </div>` : '';
  return `
    <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
      <thead><tr style="text-align:left; color:var(--ink-soft); border-bottom:1.5px solid var(--line);">

        ${cfg.map(c=>`<th style="padding:8px 6px; text-align:center;">${c.key}</th>`).join('')}
        <th style="padding:8px 6px; text-align:center;">%Hadir</th>
      </tr></thead>
      <tbody>
      ${trs}
      </tbody>
    </table>
    </div>
    ${pager}`;
}

/* =========================================================================
   KARTU KELUARGA (KK) — isi otomatis data santri dari foto KK
   Foto KK disimpan sebagai Blob di IndexedDB (bukan base64 di localStorage
   agar kuota tidak cepat penuh). OCR dijalankan oleh Tesseract.js (lazy-load,
   berjalan di worker internal-nya sehingga tidak membekukan antarmuka).
   ========================================================================= */
const KkDB = (()=>{
  const DB_NAME = 'mda_kk', STORE = 'kk', VERSION = 1;
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, VERSION);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess = ()=>{ dbp = req.result; resolve(dbp); };
      req.onerror = ()=>reject(req.error);
    });
  }
  return {
    async put(id, blob){
      const db = await open();
      return new Promise((res, rej)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, id);
        tx.oncomplete = ()=>res();
        tx.onerror = ()=>rej(tx.error);
      });
    },
    async get(id){
      if(!id) return null;
      const db = await open();
      return new Promise((res, rej)=>{
        const tx = db.transaction(STORE, 'readonly');
        const rq = tx.objectStore(STORE).get(id);
        rq.onsuccess = ()=>res(rq.result || null);
        rq.onerror = ()=>rej(rq.error);
      });
    },
    async remove(id){
      if(!id) return;
      const db = await open();
      return new Promise((res, rej)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = ()=>res();
        tx.onerror = ()=>rej(tx.error);
      });
    }
  };
})();
function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/data:([^;]+)/)||[])[1] || 'image/jpeg';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function normDobId(str){
  const m = String(str||'').replace(/\s+/g,' ').match(/\b(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})\b/);
  if(!m) return '';
  let d = +m[1], mo = +m[2], y = +m[3];
  if(mo > 12 && d <= 12){ const t = d; d = mo; mo = t; }
  if(mo > 12 || mo < 1 || d > 31 || d < 1) return '';
  if(y < 100) y += (y > 60 ? 1900 : 2000);
  if(y < 1950 || y > 2020) return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseKkText(text){
  const addr = {};
  const clean = (s)=>String(s||'').trim().replace(/[|(){}\[\]]+/g,' ').replace(/\s{2,}/g,' ');
  const full = String(text||'').replace(/\r/g,'').replace(/[^\x00-\x7F\w\s.,\/\-]/g,' ').split(/\n+/).map(clean).filter(Boolean).join('\n');
  const grab = (re)=>{ const m = full.match(re); return m ? clean(m[1]) : ''; };
  addr.provinsi = grab(/Provinsi\s*[:.]?\s*([^\n]+)/i);
  addr.kabupaten = grab(/Kabupaten\s*\/?\s*Kota\s*[:.]?\s*([^\n]+)/i) || grab(/Kabupaten\s*[:.]?\s*([^\n]+)/i);
  addr.kecamatan = grab(/Kecamatan\s*[:.]?\s*([^\n]+)/i);
  addr.desa = grab(/Desa\s*\/?\s*Kelurahan\s*[:.]?\s*([^\n]+)/i) || grab(/Desa\s*[:.]?\s*([^\n]+)/i);
  addr.kodepos = grab(/Kode\s*Pos\s*[:.]?\s*([0-9]{4,6})/i);
  const rtm = full.match(/RT\s*[\/.:]?\s*(\d{1,3})/i);
  const rwm = full.match(/RW\s*[\/.:]?\s*(\d{1,3})/i);
  addr.rt = rtm ? rtm[1] : '';
  addr.rw = rwm ? rwm[1] : '';
  const al = grab(/Alamat\s*[:.]?\s*([^\n]+)/i);
  addr.jalan = al.replace(/RT\s*\d+.*/i,'').replace(/[;,]+$/,'').trim();
  if(!addr.rt){ const jrt = (al||'').match(/RT\s*[\/.:]?\s*(\d{1,3})/i); if(jrt) addr.rt = jrt[1]; }
  if(!addr.rw){ const jrw = (al||'').match(/RW\s*[\/.:]?\s*(\d{1,3})/i); if(jrw) addr.rw = jrw[1]; }
  const members = [];
  const seen = {};
  const nikRe = /\b(\d{16})\b/g;
  let m;
  while((m = nikRe.exec(full))){
    const nik = m[1];
    if(seen[nik]) continue;
    seen[nik] = true;
    const win = full.slice(m.index + 16, m.index + 16 + 240);
    const nameM = win.match(/^\s*[\n\s]*([A-Za-z][A-Za-z .'\'-]{2,39})/);
    let name = nameM ? clean(nameM[1].replace(/^(NAMA|ANAK|SUAMI|ISTRI|KEPALA)\s+/i,'').replace(/\s+TANGGAL.*$/i,'').replace(/\s+[LP]\s*$/i,'')) : '';
    const dobM = win.match(/\b(\d{1,2})[\s\-\\\/.]{1,3}(\d{1,2})[\s\-\\\/.]{1,3}(\d{2,4})\b/);
    const dob = dobM ? normDobId(dobM[1]+'/'+dobM[2]+'/'+dobM[3]) : '';
    const faM = win.match(/NAMA\s*AYAH\s*[:.]?\s*([A-Za-z][A-Za-z .'\'-]{2,39})/i);
    const moM = win.match(/NAMA\s*IBU\s*[:.]?\s*([A-Za-z][A-Za-z .'\'-]{2,39})/i);
    members.push({
      name: name || 'Anggota KK (nama tidak terbaca)', dob, nik,
      fatherName: faM ? clean(faM[1]) : '',
      motherName: moM ? clean(moM[1]) : ''
    });
  }
  if(!members.length){
    const re = /([A-Z][A-Za-z .'\'-]{2,39})\s+\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{2,4}/g;
    let mm;
    while((mm = re.exec(full))){
      const name = clean(mm[1]).replace(/^(NAMA|ANAK|SUAMI|ISTRI)\s+/i,'').replace(/\s+TANGGAL.*$/i,'').replace(/\s+[LP]\s*$/i,'');
      const d = mm[0].match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
      members.push({ name, dob: d ? normDobId(d[1]+'/'+d[2]+'/'+d[3]) : '', nik:'', fatherName:'', motherName:'' });
    }
  }
  const gf = full.match(/Nama\s*Ayah\s*[:.]?\s*([A-Z][A-Za-z .'\'-]{2,39})/i);
  const gm = full.match(/Nama\s*Ibu\s*[:.]?\s*([A-Z][A-Za-z .'\'-]{2,39})/i);
  return {
    address: addr,
    members,
    globalFather: gf ? clean(gf[1]) : '',
    globalMother: gm ? clean(gm[1]) : ''
  };
}
let kkScan = null; // { photoDataUrl, members, address, globalFather, globalMother, pob, busy }
let pendingKkBlob = null; // blob KK terkompresi yang akan disimpan saat save
function kkFillStatus(html){
  const el = document.getElementById('kkStatus');

function kkHandleFile(file){
  if(!file) return;
  resizeImageFile(file, 1200, (smallDataUrl)=>{
    pendingKkBlob = dataUrlToBlob(smallDataUrl);
    kkScan = { photoDataUrl: smallDataUrl, members: [], address: {}, globalFather:'', globalMother:'', pob:'', busy:false };
    const prev = document.getElementById('kkPreview');
    if(prev) prev.innerHTML = '<img src="'+smallDataUrl+'" alt="">';
    runKkOcr();
  });

async function runKkOcr(){
  if(!kkScan || !kkScan.photoDataUrl){ showToast('Pilih foto KK dulu.', 'warn'); return; }
  if(kkScan.busy) return;
  kkScan.busy = true;
  kkFillStatus('<span style="display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);">'+icon('refresh','spin')+' Membaca Kartu Keluarga…</span>');
  try{
    await ensureLib('tesseract');
    if(typeof Tesseract === 'undefined') throw new Error('Pustaka OCR tidak termuat.');
    const worker = await Tesseract.createWorker('ind', 1, {
      logger: (m)=>{ if(m && m.status === 'recognizing text') kkFillStatus('<span style="display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);">'+icon('refresh','spin')+' Membaca Kartu Keluarga… '+Math.round((m.progress||0)*100)+'%</span>'); }
    });
    let res = await worker.recognize(kkScan.photoDataUrl);
    let text = (res.data && res.data.text) || '';
    if(text.trim().length < 40){
      await worker.setLanguage('eng');
      const r2 = await worker.recognize(kkScan.photoDataUrl);
      text = ((r2.data && r2.data.text) || '') + '\n' + text;
    }
    await worker.terminate();
    const parsed = parseKkText(text);
    kkScan.members = parsed.members;
    kkScan.address = parsed.address;
    kkScan.globalFather = parsed.globalFather;
    kkScan.globalMother = parsed.globalMother;
    const box = document.getElementById('kkMembers');
    if(box) box.style.display = '';
    if(!kkScan.members.length){
      kkFillStatus('<div class="alert" style="margin:8px 0 0;">'+icon('alert')+' <div><b>Anggota KK tidak terbaca</b> Foto kurang jelas, miring, atau terkena cahaya. Isi manual di bawah, atau pilih foto ulang yang lebih jelas.</div></div>');
    }else{
      kkFillStatus('<span style="font-size:12.5px; color:var(--green-800); font-weight:700;">Ditemukan '+kkScan.members.length+' anggota. Ketik inisial untuk memfilter, lalu pilih santrinya.</span>');
      kkRenderMembers();
    }
  }catch(err){
    console.error(err);
    kkFillStatus('<div class="alert" style="margin:8px 0 0;">'+icon('alert')+' <div><b>Gagal membaca Kartu Keluarga</b> '+(err && err.message ? escapeHtml(err.message) : 'Tidak dapat memuat pustaka OCR — butuh koneksi internet pada pemindaian pertama.')+'</div></div>');
  }finally{
    kkScan.busy = false;
  }
}
function kkRenderMembers(){
  const list = document.getElementById('kkMemberList');
  if(!list) return;
  const q = (document.getElementById('kkMemberFilter')||{}).value || '';
  const filt = q.trim().toLowerCase();
  const arr = (kkScan.members||[]).map((mm, idx)=>({mm, idx}))
    .filter(x=> !filt || (x.mm.name||'').toLowerCase().indexOf(filt)!==-1 || (x.mm.nik||'').indexOf(filt)!==-1);
  list.innerHTML = arr.length ? arr.map(x=>`
    <button type="button" class="kk-member" data-kk-member="${x.idx}">
      <b>${escapeHtml(x.mm.name)}</b>
      <span>${x.mm.dob ? 'Lahir '+fmtDateID(x.mm.dob) : (x.mm.nik ? 'NIK '+escapeHtml(x.mm.nik) : '')}</span>
    </button>`).join('') : '<div style="font-size:12px; color:var(--ink-soft); padding:8px 0;">Tidak ada yang cocok.</div>';
}
function kkSelectMember(idx){
  const mm = (kkScan.members||[])[idx];
  if(!mm) return;
  const fill = (id, val)=>{ const el = document.getElementById(id); if(el) el.value = val || ''; };
  fill('sName', mm.name);
  fill('sDob', mm.dob);
  fill('sPob', (kkScan.pob || ''));
  const a = kkScan.address || {};
  fill('sAddrJalan', a.jalan); fill('sAddrRt', a.rt); fill('sAddrRw', a.rw);
  fill('sAddrDesa', a.desa); fill('sAddrKec', a.kecamatan); fill('sAddrKab', a.kabupaten);
  fill('sAddrProv', a.provinsi); fill('sAddrPos', a.kodepos);
  const fa = mm.fatherName || kkScan.globalFather;
  const mo = mm.motherName || kkScan.globalMother;
  if(fa){ fill('sGuardian', fa); fill('sRel', 'ayah'); }
  else if(mo){ fill('sGuardian', mo); fill('sRel', 'ibu'); }
  showToast('Data dari KK terisi — periksa sebelum menyimpan.', 'success');
}

      pendingPhoto = null;
      kkScan = null;
      let list = students();
      if(App.editingStudentId==='new'){
        list.push(Object.assign({id:uid()}, data));
      } else {
        list = list.map(s=>s.id===App.editingStudentId?Object.assign({},s,data):s);
      }
      saveStudents(list);
      App.editingStudentId=null;
      render();
    });
  }
  const delBtn = document.getElementById('deleteStudentBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      showConfirm('Hapus data santri ini? Data absensi terkait akan tetap tersimpan sebagai riwayat.', ()=>{
        const list = students().filter(s=>s.id!==App.editingStudentId);
        saveStudents(list);
        App.editingStudentId=null;
        render();
        showToast('Data santri dihapus.', 'info');
      }, {title:'Hapus Santri', okText:'Ya, Hapus'});
    });
  }
  // live input auto-save while editing (blur-based, still no explicit save button needed for edits— but we keep single done button for clarity + validation)
}

/* =========================================================================
   VIEW: CLASSES (CRUD)
   ========================================================================= */
function viewClasses(){
  const cls = classes();
  const st = students();
  const att = attendance();
  const today = todayISO();
  const todayRec = att[today] || {};
  return `
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 class="page-title">Kelas</h1>
    <button class="btn btn-primary btn-sm" id="addClassBtn">${icon('plus')} Tambah</button>
  </div>
  <p class="page-sub">Kelola tingkatan/kelas madrasah</p>

  ${cls.length===0 ? `<div class="card"><div class="empty">${icon('classes')}<b>Belum ada kelas</b>Tambahkan kelas pertama, misalnya "Kelas 1".</div></div>` :
  `<div class="class-grid">
    ${cls.map(c=>{
      const count = st.filter(s=>s.classId===c.id && s.active!==false).length;
      const rec = todayRec[c.id] || {};
      let h=0,s=0,i=0,a=0;
      st.filter(x=>x.classId===c.id && x.active!==false).forEach(x=>{ const v=rec[x.id]; if(v==='H')h++; else if(v==='S')s++; else if(v==='I')i++; else if(v==='A')a++; });
      const marked = h+s+i+a;
      const pct = marked ? Math.round(h/marked*100) : 0;
      return `
      <div class="class-card" data-edit-class="${c.id}" aria-label="Edit kelas ${escapeHtml(c.name)}">
        <div class="cc-head">
          <div class="cc-icon">${icon('classes')}</div>
          <div class="cc-txt">
            <div class="cc-name">${escapeHtml(c.name)}</div>
            <div class="cc-meta">${c.teacher?('Ustadz: '+escapeHtml(c.teacher)+' &middot; '):''}${count} santri</div>
          </div>
          <span class="cc-edit icon-btn" aria-hidden="true">${icon('edit')}</span>
        </div>
        <div class="cc-stats">
          <div class="cc-stat"><div class="n cc-n-h">${h}</div><div class="l">Hadir</div></div>
          <div class="cc-stat"><div class="n cc-n-s">${s}</div><div class="l">Sakit</div></div>
          <div class="cc-stat"><div class="n cc-n-i">${i}</div><div class="l">Izin</div></div>
          <div class="cc-stat"><div class="n cc-n-a">${a}</div><div class="l">Alpha</div></div>
        </div>
        <div class="cc-foot">
          <div class="cc-bar"><div class="cc-bar-fill" style="width:${pct}%"></div></div>
          <span class="cc-pct">${pct}% Hadir</span>
        </div>
      </div>`;
    }).join('')}
  </div>`}
  ${App.editingClassId!==null ? renderClassModal() : ''}
  `;
}
function renderClassModal(){
  const isNew = App.editingClassId==='new';
  const c = isNew ? {id:'',name:'',teacher:''} : classes().find(x=>x.id===App.editingClassId);
  if(!c) return '';
  return `
  <div class="modal-backdrop" id="classModalBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${isNew?'Tambah Kelas':'Edit Kelas'}</h3><button class="icon-btn" id="closeClassModal" aria-label="Tutup formulir kelas">${icon('close')}</button></div>
      <div class="field"><label>Nama Kelas</label><input type="text" id="cName" value="${escapeHtml(c.name)}" placeholder="Contoh: Kelas 1 / Ula A"></div>
      <div class="field"><label>Nama Guru Pengampu / Wali Kelas (Opsional)</label><input type="text" id="cTeacher" value="${escapeHtml(c.teacher||'')}" placeholder="Contoh: Ust. Ahmad Fauzi"></div>
      <div style="display:flex; gap:10px;">
        ${!isNew?`<button class="btn btn-danger" id="deleteClassBtn">${icon('trash')}</button>`:''}
        <button class="btn btn-primary" id="saveClassBtn" style="flex:1">${isNew?'Tambah Kelas':'Selesai'}</button>
      </div>
    </div>
  </div>`;
}
function bindClasses(){
  const addBtn = document.getElementById('addClassBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{ App.editingClassId='new'; render(); });
  document.querySelectorAll('[data-edit-class]').forEach(b=>b.addEventListener('click', ()=>{ App.editingClassId=b.getAttribute('data-edit-class'); render(); }));
  const backdrop = document.getElementById('classModalBackdrop');
  if(backdrop) backdrop.addEventListener('click', e=>{ if(e.target===backdrop){ App.editingClassId=null; render(); } });
  const closeBtn = document.getElementById('closeClassModal');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ App.editingClassId=null; render(); });
  const saveBtn = document.getElementById('saveClassBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const name = document.getElementById('cName').value.trim();
      const teacher = document.getElementById('cTeacher').value.trim();
      if(!name){ showToast('Nama kelas wajib diisi.', 'error'); return; }
      let list = classes();
      if(App.editingClassId==='new') list.push({id:uid(), name, teacher});
      else list = list.map(c=>c.id===App.editingClassId?Object.assign({},c,{name,teacher}):c);
      saveClasses(list);
      App.editingClassId=null;
      render();
    });
  }
  const delBtn = document.getElementById('deleteClassBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      const inUse = students().some(s=>s.classId===App.editingClassId);
      const doDelete = ()=>{
        const list = classes().filter(c=>c.id!==App.editingClassId);
        saveClasses(list);
        App.editingClassId=null;
        render();
        showToast('Kelas dihapus.', 'info');
      };
      showConfirm(inUse
        ? 'Kelas ini masih memiliki santri. Hapus kelas tetap dilanjutkan? Santri tidak akan terhapus, tapi perlu dipindahkan kelasnya.'
        : 'Hapus kelas ini?', doDelete, {title:'Hapus Kelas', okText:'Ya, Hapus'});
    });
  }
}

        <label>Semua Kelas</label>
        <input type="text" value="${cls.length} kelas terdaftar" disabled style="background:var(--green-50);">
      </div>`}
      <div class="field" style="margin-bottom:0;">
        <label>Periode</label>
        <select id="sharePeriod">

function sharePeriodLabel(){
  return App.sharePeriod==='daily'?'Harian':App.sharePeriod==='weekly'?'Mingguan':App.sharePeriod==='monthly'?'Bulanan':App.sharePeriod==='custom'?'Kustom':'Tahunan';
}
function buildShareAllCardHtml(){

  const {from,to} = shareRange();
  const rows = cls.map(c=>{

    const totals = {}; cfg.forEach(cf=>totals[cf.key]=0);

      const day = App.shareCustomDate || todayISO();
      const rec = (att[day]||{})[c.id] || {};

    const pct = total>0 ? Math.round(hadir/total*100) : 0;

function buildShareClassDailyCardHtml(c){
  const p = profile();
  const st = students().filter(s=>s.classId===c.id && s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const cfg = statusConfig();
  const day = App.shareCustomDate || todayISO();
  const att = attendance();
  const dateRec = (att[day]||{})[c.id] || {};
  const ABSENT_SORT_ORDER = {A:0, I:1, S:2};
  const rows = st.map(s=>({name:s.name, status:dateRec[s.id]||''}));
  const marked = rows.filter(r=>r.status);
  const unmarkedRows = rows.filter(r=>!r.status);
  marked.sort((a,b)=>{
    const pa = a.status==='H' ? 3 : (ABSENT_SORT_ORDER[a.status]??9);
    const pb = b.status==='H' ? 3 : (ABSENT_SORT_ORDER[b.status]??9);
    if(pa!==pb) return pa-pb;
    return a.name.localeCompare(b.name);
  });
  const ordered = [...marked, ...unmarkedRows];
  const totals = {}; cfg.forEach(cf=>totals[cf.key]=0);
  rows.forEach(r=>{ if(r.status) totals[r.status]=(totals[r.status]||0)+1; });
  const belumDiabsen = unmarkedRows.length;

  function statusMeta(key){
    if(!key) return {label:'Belum diabsen', color:'#9AA5AC'};
    const c2 = cfg.find(x=>x.key===key);
    return c2 || {label:key, color:'#888'};
  }
  const half = Math.ceil(ordered.length/2);
  const col1 = ordered.slice(0, half);
  const col2 = ordered.slice(half);
  function renderNameCol(colRows, startIdx){
    if(colRows.length===0) return '';
    return `<table style="width:100%; border-collapse:collapse; font-size:10.5px;">
      <thead><tr style="background:rgba(255,255,255,.12); text-align:left;">
        <th style="padding:6px 3px; text-align:center; width:18px;">No</th>
        <th style="padding:6px 5px;">Nama</th>
        <th style="padding:6px 4px; text-align:center; width:34px;">Status</th>
      </tr></thead>
      <tbody>
      ${colRows.map((r,idx)=>{
        const m = statusMeta(r.status);
        return `
        <tr style="border-top:1px solid rgba(255,255,255,.12);">
          <td style="padding:5px 3px; text-align:center; opacity:.8;">${startIdx+idx+1}</td>
          <td style="padding:5px 5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:1px;">${escapeHtml(r.name)}</td>
          <td style="padding:5px 4px; text-align:center; font-weight:800; color:${m.color};">${r.status || '–'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
  }
  return `
  <div style="width:100%; max-width:520px; margin:0 auto; background:linear-gradient(170deg,#08543C,#0B6B4F); font-family:'Plus Jakarta Sans',sans-serif; color:#fff; padding:26px 22px; position:relative;">
    <div style="text-align:center; margin-bottom:14px;">
      <div style="width:50px;height:50px;border-radius:50%; margin:0 auto 8px; background:radial-gradient(circle at 35% 30%,#E8C766,#A9821D); display:flex; align-items:center; justify-content:center; overflow:hidden;">
        ${p.logo?`<img src="${sanitizeUrl(p.logo)}" style="width:100%;height:100%;object-fit:cover;">`:`<svg viewBox="0 0 24 24" width="24" height="24" fill="#08543C"><path d="M13 2a10 10 0 1 0 9 14.9A8 8 0 0 1 13 2Z"/></svg>`}
      </div>
      <div style="font-family:'Amiri',serif; font-weight:700; font-size:17px;">${escapeHtml(p.name||DEFAULT_PROFILE.name)}</div>
      <div style="font-size:10.5px; opacity:.8;">${escapeHtml([p.desa,p.kecamatan,p.kabupaten].filter(Boolean).join(', ')||'')}</div>
      <div style="font-family:'Amiri',serif; color:#E8C766; font-size:18px; margin-top:8px;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    </div>
    <div style="background:rgba(255,255,255,.08); border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid rgba(255,255,255,.15);">
      <div style="font-size:11px; opacity:.75; text-transform:uppercase; letter-spacing:.5px;">Rekap Absensi Harian</div>
      <div style="font-size:19px; font-weight:800; margin-top:4px;">${escapeHtml(c.name)}</div>
      <div style="font-size:12px; opacity:.85; margin-top:2px;">${c.teacher?('Guru: '+escapeHtml(c.teacher)+' &middot; '):''}${fmtDateID(day)}</div>
      <div style="font-size:10.5px; opacity:.7; margin-top:2px;">${fmtHijri(day)}</div>
    </div>
    ${ordered.length===0 ? `
    <div style="background:rgba(255,255,255,.06); border-radius:12px; padding:16px; text-align:center; font-size:12px; opacity:.75;">Belum ada santri di kelas ini</div>
    ` : `
    <div style="display:flex; gap:8px;">
      <div style="flex:1; min-width:0; background:rgba(255,255,255,.06); border-radius:12px; overflow:hidden;">${renderNameCol(col1, 0)}</div>
      <div style="flex:1; min-width:0; background:rgba(255,255,255,.06); border-radius:12px; overflow:hidden;">${renderNameCol(col2, half)}</div>
    </div>
    <div style="display:flex; gap:6px; margin-top:12px;">
      ${cfg.map(cf=>`
        <div style="flex:1; background:rgba(255,255,255,.1); border-radius:10px; padding:8px 4px; text-align:center;">
          <div style="font-size:14px; font-weight:800;">${totals[cf.key]||0}</div>
          <div style="font-size:8.5px; opacity:.8;">${escapeHtml(cf.label)}</div>
        </div>`).join('')}
      ${belumDiabsen>0 ? `
        <div style="flex:1; background:rgba(255,255,255,.1); border-radius:10px; padding:8px 4px; text-align:center;">
          <div style="font-size:14px; font-weight:800;">${belumDiabsen}</div>
          <div style="font-size:8.5px; opacity:.8;">Belum Absen</div>
        </div>` : ''}

function bindShare(){
  document.querySelectorAll('[data-share-mode]').forEach(b=>b.addEventListener('click', ()=>{
    App.shareMode = b.getAttribute('data-share-mode');
    if(App.shareMode!=='student' && App.sharePeriod==='yearly') App.sharePeriod='monthly';
    render();
  }));
  const s1 = document.getElementById('shareStudent');
  if(s1) s1.addEventListener('change', e=>{ App.shareStudentId=e.target.value; render(); });
  const s3 = document.getElementById('shareClass');
  if(s3) s3.addEventListener('change', e=>{ App.shareClassId=e.target.value; render(); });
  const s2 = document.getElementById('sharePeriod');
  if(s2) s2.addEventListener('change', e=>{ App.sharePeriod=e.target.value; render(); });
  const sd = document.getElementById('shareDate');
  if(sd) sd.addEventListener('change', e=>{ App.shareCustomDate = e.target.value || todayISO(); render(); });
  const sw = document.getElementById('shareWeek');
  if(sw) sw.addEventListener('change', e=>{ App.shareWeeklyDate = e.target.value || todayISO(); render(); });
  const sf = document.getElementById('shareFrom');
  if(sf) sf.addEventListener('change', e=>{ App.shareCustomFrom = e.target.value || todayISO(); render(); });
  const st2 = document.getElementById('shareTo');
  if(st2) st2.addEventListener('change', e=>{ App.shareCustomTo = e.target.value || todayISO(); render(); });
  const dl = document.getElementById('downloadJpgBtn');
  if(dl){
    dl.addEventListener('click', ()=>{
      const target = document.getElementById('shareCard');
      if(!target){ showToast('Kartu belum tersedia.', 'error'); return; }
      dl.disabled=true; dl.textContent='Memproses...';
      ensureLib('html2canvas')
        .then(()=> html2canvas(target, {scale:2, useCORS:true, backgroundColor:null}))
        .then(canvas=>{
        let filename;
        if(App.shareMode==='class'){
          const c = classes().find(x=>x.id===App.shareClassId);
          filename = 'Rekap-Kelas-'+(c?c.name.replace(/\s+/g,'_'):'kelas')+'-'+App.sharePeriod+'.jpg';
        } else if(App.shareMode==='all'){
          filename = 'Rekap-Semua-Kelas-'+App.sharePeriod+'.jpg';
        } else {
          const s = students().find(x=>x.id===App.shareStudentId);
          filename = 'Kartu-Absensi-'+(s?s.name.replace(/\s+/g,'_'):'santri')+'.jpg';
        }
        canvas.toBlob(async (blob)=>{
          if(!blob){
            showToast('Gagal membuat gambar. Coba lagi.', 'error');
            dl.disabled=false; dl.innerHTML = icon('download')+' Unduh sebagai JPG';
            return;
          }
          const ok = await downloadFile(blob, filename, 'image/jpeg');
          if(!ok) showToast('Gagal mengunduh gambar. Pastikan menggunakan browser Chrome terbaru.', 'error');
          dl.disabled=false; dl.innerHTML = icon('download')+' Unduh sebagai JPG';
        }, 'image/jpeg', 0.95);
      }).catch(()=>{
        showToast('Gagal membuat gambar. Coba lagi.', 'error');
        dl.disabled=false; dl.innerHTML = icon('download')+' Unduh sebagai JPG';
      });
    });
  }
}

function viewFinance(){
  const fin = finance();
  const r = rekening();
  const cls = classes();
  const st = students();
  const managed = canManageFinance();
  const nameOf = id => { const s = st.find(x=>x.id===id); return s ? s.name : '—'; };
  const classOf = id => { const s = st.find(x=>x.id===id); if(!s) return ''; const c = cls.find(c=>c.id===s.classId); return c ? c.name : ''; };

  // Ringkasan
  const totals = {}; PAY_ITEMS.forEach(i=>totals[i.key]=0);
  let totalAll = 0;
  fin.forEach(f=>{ totals[f.item]=(totals[f.item]||0)+f.amount; totalAll += f.amount; });

  // Status per santri
  const filterItemKey = App.finItemFilter || 'bangunan';
  const filterItem = payItem(filterItemKey);
  const statusStudents = st
    .filter(s=>s.active!==false && (!App.finClassFilter || s.classId===App.finClassFilter))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const statusRows = statusStudents.map(s=>{
    const paid = fin.filter(f=>f.studentId===s.id && f.item===filterItemKey).reduce((x,f)=>x+f.amount,0);
    const target = filterItem.amount;
    const pct = target ? Math.min(100, Math.round(paid/target*100)) : 0;
    const remain = Math.max(target-paid, 0);
    const badge = target===0 ? null : (paid>=target ? {t:'Lunas', c:'fin-paid'} : (paid>0 ? {t:'Cicilan', c:'fin-part'} : {t:'Belum', c:'fin-none'}));
    return {s, paid, target, pct, remain, badge};
  });

  // Riwayat
  const q = (App.finSearch||'').toLowerCase();
  const history = fin.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const filtered = q ? history.filter(f=> nameOf(f.studentId).toLowerCase().includes(q) || (f.note||'').toLowerCase().includes(q)) : history;

  const studentOptions = cls.map(c=>{

    return `<optgroup label="${escapeHtml(c.name)}">${list.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</optgroup>`;

    ${r.number ? `
    <div class="fr-number">${escapeHtml(r.number)}
      <button class="fr-copy" id="finCopyBtn">${icon('copy')} Salin</button>

    <div class="fr-holder">a.n. ${escapeHtml(r.holder || 'Madrasah')}</div>` : ''}
    <div style="font-size:10.5px; opacity:.7; margin-top:10px;">Wali santri bisa membayar langsung di aplikasi ini (minimal Rp10.000) lewat tombol "Bayar Sekarang" di bawah — atau transfer ke rekening di atas lalu catat pembayarannya.</div>
  </div>

  <div class="fin-sum-grid">
    <div class="fin-sum"><div class="fs-num">${fmtRp(totalAll)}</div><div class="fs-lbl">Total Terkumpul</div></div>
    <div class="fin-sum"><div class="fs-num">${fin.length}</div><div class="fs-lbl">Transaksi</div></div>
    <div class="fin-sum"><div class="fs-num">${fmtRp(totals.bangunan)}</div><div class="fs-lbl">Biaya Bangunan</div></div>
    <div class="fin-sum"><div class="fs-num">${fmtRp(totals.imtihan)}</div><div class="fs-lbl">Uang Imtihan</div></div>
    <div class="fin-sum"><div class="fs-num">${fmtRp(totals.infaq)}</div><div class="fs-lbl">Infaq</div></div>
    <div class="fin-sum"><div class="fs-num">${fmtRp(totals.lainnya)}</div><div class="fs-lbl">Lainnya</div></div>
  </div>

  <div class="card">

    <p style="font-size:12px; color:var(--ink-soft); margin-top:-6px;">Pembayaran bisa dilakukan <b>langsung di aplikasi ini</b> — pilih santri, jenis pembayaran, dan nominal (minimal <b>Rp10.000</b>), lalu ketuk <b>Bayar Sekarang</b>. Pembayaran rutin boleh diangsur.</p>
