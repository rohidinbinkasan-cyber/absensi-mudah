<style>
:root{
  /* Palet utama — Hijau Islam + Emas, krem ivory, tinta gelap */
  --green-950:#10241B;
  --green-900:#1B4332;
  --green-800:#2D6A4F;
  --green-700:#3E7D5F;
  --green-100:#DCE8E0;
  --green-50:#F0F5F1;
  --gold-700:#A97F12;
  --gold-600:#D4A017;
  --gold-500:#C8971C;
  --gold-400:#DFB84F;
  --gold-100:#F9F1DC;
  --cream:#F5F0E8;
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --ink-soft:#5C5A52;
  --line:#E5DFD1;
  --status-h:#1B8A5A;
  --status-s:#2F6FD6;
  --status-i:#D8930C;
  --status-a:#D14343;
  --radius:14px;
  --shadow:0 2px 10px rgba(27,67,50,.08);
  --font-display:'Playfair Display','Cinzel','Amiri',serif;
  --font-body:'Inter','Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','DM Mono',ui-monospace,Consolas,monospace;
}
[data-theme="teal"]{ --green-950:#052426; --green-900:#063B3E; --green-800:#0A5C5F; --green-700:#0E7377; --gold-700:#A9821D; --gold-600:#C9A227; --gold-400:#E8C766; }
[data-theme="navy"]{ --green-950:#071B30; --green-900:#0B2A4A; --green-800:#123B66; --green-700:#1A4E82; --gold-700:#B8860B; --gold-600:#D4AF37; --gold-400:#E9CE7C; }
[data-theme="maroon"]{ --green-950:#2E0A10; --green-900:#4A1119; --green-800:#6E1A25; --green-700:#8C2431; --gold-700:#A9821D; --gold-600:#C9A227; --gold-400:#E8C766; }
[data-theme="purple"]{ --green-950:#1F1035; --green-900:#331A57; --green-800:#4A2680; --green-700:#5E33A0; --gold-700:#A9821D; --gold-600:#C9A227; --gold-400:#E8C766; }
[data-theme="brown"]{ --green-950:#2A1B0E; --green-900:#432C16; --green-800:#5F3F1F; --green-700:#7A5228; --gold-700:#A9821D; --gold-600:#C9A227; --gold-400:#E8C766; }
[data-theme="slate"]{ --green-950:#151B23; --green-900:#232D3A; --green-800:#334155; --green-700:#475569; --gold-700:#A9821D; --gold-600:#C9A227; --gold-400:#E8C766; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
/* ---------- Fixed background layer ----------
   A separate fixed-position layer (instead of background-attachment:fixed on
   body) avoids the flicker/"kerlap-kerlip" repaint bug that mobile browsers
   (esp. Android Chrome/WebView) show when a fixed gradient background is
   attached directly to a scrolling body. This layer is composited on its own
   GPU layer and never needs to repaint while the page scrolls. */
#bgLayer{
  position:fixed; inset:0; z-index:-1;
  background-color:var(--cream);
  background-image:
    radial-gradient(circle at 0% 0%, var(--green-100) 0%, transparent 55%),
    radial-gradient(circle at 100% 0%, var(--gold-100) 0%, transparent 45%);
  background-size:cover; background-position:center; background-repeat:no-repeat;
  transform:translateZ(0);
  backface-visibility:hidden;
  pointer-events:none;
}
button{font-family:inherit; cursor:pointer; -webkit-user-select:none; user-select:none;}
input,select,textarea{font-family:inherit; font-size:15px;}
a{color:inherit;}
button, input, select, textarea, a, .chip, .swatch, .tab-btn, .status-btn, .absent-tile, .class-link-chip, .stat-grid.linkable, .sheet-item, .icon-btn{touch-action:manipulation;}
::selection{background:var(--gold-400); color:var(--green-950);}

/* ---------- Islamic geometric pattern (signature motif) ---------- */
.motif-strip{
  height:8px;
  background-image:
    repeating-linear-gradient(135deg, var(--gold-600) 0 5px, transparent 5px 11px),
    repeating-linear-gradient(45deg, rgba(232,199,102,.45) 0 5px, transparent 5px 11px);
  opacity:.5;
}
.star8{ display:inline-block; }

/* ---------- App shell ---------- */
#app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; display:flex; flex-direction:column;}
@media(min-width:900px){
  #app{max-width:none; display:grid; grid-template-columns:250px 1fr; min-height:100vh;}
}

/* ---------- Header ---------- */
.app-header{
  background:linear-gradient(160deg, var(--green-900), var(--green-800) 60%, var(--green-700));
  color:#fff;
  padding:18px 18px 24px;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 22px rgba(6,42,31,.16);
}
.app-header::before{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold-400), var(--gold-600), var(--gold-400), transparent);
}
.app-header::after{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 90% -10%, rgba(255,255,255,.15), transparent 40%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px);
  pointer-events:none;
}
.header-top{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.crescent-badge{
  width:44px; height:44px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-400), var(--gold-700));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.25);
}
.header-titles{flex:1; min-width:0;}
.madrasah-name{font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.2; margin:0; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.madrasah-loc{font-size:11.5px; opacity:.85; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bismillah{
  font-family:var(--font-display);
  text-align:center; color:var(--gold-400);
  font-size:22px; margin-top:12px; position:relative; z-index:1;
  letter-spacing:.5px; text-shadow:0 1px 10px rgba(0,0,0,.3);
}
.bism-flank{font-size:10px; color:var(--gold-400); opacity:.85; margin:0 8px; vertical-align:5px;}
.header-sub{text-align:center; font-size:11px; color:rgba(255,255,255,.65); margin-top:2px; position:relative; z-index:1;}

/* ---------- Nav (mobile bottom / desktop side) — lingkaran 3D ---------- */
.bottom-nav{
  position:sticky; bottom:0; z-index:40;
  margin-top:auto;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,246,238,.98));
  border-top:1px solid rgba(232,199,102,.45);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 18px rgba(8,50,36,.10);
}
@media(max-width:899px){
  /* Nav mobile ditempatkan SETELAH konten di dalam flex #app, sehingga
     sticky bottom benar-benar menempel di bawah layar (bukan ikut ter-scroll). */
  .bottom-nav{order:2;}
  #app > div:nth-child(2){order:-1;}
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px;
  background:none; border:none; color:var(--ink-soft); padding:4px 2px 6px; border-radius:14px; font-size:10.5px; font-weight:600;
  position:relative; min-height:58px;
  transition:transform .18s var(--ease-spring, cubic-bezier(.34,1.56,.64,1)), color .18s ease;
}
.nav-btn svg{width:20px; height:20px; stroke:var(--ink-soft); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:stroke .18s ease, transform .18s var(--ease-spring, cubic-bezier(.34,1.56,.64,1));}
.nav-ic{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:linear-gradient(180deg, #FFFFFF 0%, #EDF3EF 100%);
  border:1px solid rgba(8,83,60,.16);
  box-shadow:0 2px 5px rgba(8,50,36,.16), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 4px rgba(8,50,36,.06);
  transition:transform .18s var(--ease-spring, cubic-bezier(.34,1.56,.64,1)), box-shadow .18s ease, background .18s ease, border-color .18s ease;
}
.nav-lbl{position:relative; z-index:1; transition:color .18s ease;}
.nav-btn:active{transform:scale(.97);}
.nav-btn:active .nav-ic{transform:scale(.86);}
.nav-btn.active{color:var(--green-900);}
.nav-btn.active .nav-ic{
  background:linear-gradient(180deg, #F8E7B0 0%, #E8C766 55%, #D9AD38 100%);
  border-color:rgba(169,130,29,.5);
  box-shadow:0 6px 14px rgba(169,130,29,.38), 0 2px 4px rgba(8,50,36,.18), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -3px 6px rgba(169,130,29,.35);
  transform:translateY(-3px) scale(1.08);
}
.nav-btn.active svg{stroke:#3A2C00; transform:scale(1.04);}
.nav-btn.active .nav-lbl{color:var(--green-900); font-weight:800;}
@keyframes navPop{
  0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(-6px) scale(1.16);}
  100%{transform:translateY(-3px) scale(1.08);}
}
.nav-btn.active .nav-ic{animation:navPop .38s var(--ease-spring, cubic-bezier(.34,1.56,.64,1));}
/* indikator emas yang bergeser mulus ke tab aktif (elemen persisten di #uiLayer) */
.nav-ind{
  position:fixed; left:0; top:0; z-index:41; pointer-events:none;
  background:linear-gradient(180deg, #F6E3A9, #C9A227);
  box-shadow:0 0 12px rgba(201,162,39,.6), 0 1px 2px rgba(169,130,29,.4);
  opacity:0;
  transition:transform .42s cubic-bezier(.4,0,.2,1), opacity .25s ease;
  will-change:transform;
}
.nav-ind.show{opacity:1;}

@media(min-width:900px){
  .bottom-nav{
    position:sticky; top:0; flex-direction:column; align-items:stretch; border-top:none; border-right:1px solid var(--line);
    padding:18px 14px; gap:6px; height:100vh; box-shadow:none;
    background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,244,235,.96));
  }
  .nav-btn{flex-direction:row; justify-content:flex-start; gap:12px; font-size:14px; padding:6px 10px; min-height:52px;}
  .nav-ic{width:40px; height:40px;}
  .nav-btn svg{width:19px; height:19px;}
}

/* ---------- Sheet (mobile "More" menu) ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(6,42,31,.45); z-index:60; display:none;}
.sheet-backdrop.open{display:block;}
.sheet{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--paper); border-radius:20px 20px 0 0; z-index:61; padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:6px auto 12px;}
.sheet-item{display:flex; align-items:center; gap:14px; padding:13px 6px; border-radius:12px; font-weight:600; font-size:15px; color:var(--ink);}
.sheet-item svg{width:15px;height:15px; stroke:var(--green-800); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.sheet-item:active{background:var(--green-50);}

/* ---------- Main content ---------- */
main{flex:1; padding:16px 16px 90px; overflow-x:hidden; overflow-anchor:none;}
@media(min-width:900px){ main{padding:24px 32px 40px;} }

.page-title{font-family:var(--font-display); font-size:21px; font-weight:700; color:var(--green-900); margin:0 0 10px; padding-bottom:8px; position:relative;}
.page-title::after{content:""; position:absolute; left:0; bottom:0; width:46px; height:2px; border-radius:2px; background:linear-gradient(90deg, var(--gold-600), transparent);}
.page-sub{font-size:13px; color:var(--ink-soft); margin:0 0 18px;}

.card{background:var(--paper); border-radius:var(--radius); box-shadow:0 4px 18px rgba(8,50,36,.07); border:1px solid rgba(8,50,36,.06); padding:16px; margin-bottom:14px; position:relative;}
.card::before{content:""; position:absolute; top:0; left:16px; right:16px; height:2px; border-radius:0 0 4px 4px; background:linear-gradient(90deg, transparent, var(--gold-600), transparent); opacity:.55;}
.card-title{font-weight:700; font-size:14.5px; color:var(--green-900); margin:0 0 10px; display:flex; align-items:center; gap:8px;}

.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
.stat-box{border-radius:var(--radius); padding:14px; color:#fff; position:relative; overflow:hidden; box-shadow:0 4px 14px rgba(8,50,36,.14);}
.stat-box::after{content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 16px); pointer-events:none;}
.stat-box .num{font-size:26px; font-weight:800; line-height:1; position:relative; z-index:1;}
.stat-box .lbl{font-size:11.5px; opacity:.9; margin-top:4px; font-weight:600; position:relative; z-index:1;}
.stat-h{background:linear-gradient(135deg,#1B8A5A,#0F6E44);}
.stat-s{background:linear-gradient(135deg,#3B7DD8,#2657A8);}
.stat-i{background:linear-gradient(135deg,#E0A72D,#B77E12);}
.stat-a{background:linear-gradient(135deg,#D64545,#A72E2E);}

.alert{display:flex; gap:10px; align-items:flex-start; background:var(--gold-100); border:1px solid var(--gold-400); color:#5C4400; border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:14px;}
.alert b{display:block; margin-bottom:2px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:11px; padding:11px 16px; font-weight:700; font-size:14px; transition:transform .12s ease, box-shadow .15s ease, background .15s ease;}
.btn:active{transform:scale(.95);}
.btn svg{width:15px; height:15px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.btn-primary{background:var(--green-800); color:#fff;}
.btn-primary:active{background:var(--green-900);}
.btn-gold{background:var(--gold-600); color:#3A2C00;}
.btn-outline{background:#fff; color:var(--green-800); border:1.5px solid var(--green-800);}
.btn-danger{background:#fff; color:var(--status-a); border:1.5px solid var(--status-a);}
.btn-ghost{background:transparent; color:var(--ink-soft);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--green-900); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--green-700);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* ---------- Input suara: bungkus field + tombol mic ---------- */
.field-voice-wrap{position:relative;}
.field-voice-wrap input, .field-voice-wrap textarea{padding-right:38px;}
.mic-btn{
  position:absolute; top:50%; right:6px; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--green-700); background:rgba(11,107,79,.08);
}
.mic-btn[data-active="1"]{color:#fff; background:var(--green-800); animation:mic-pulse 1.2s ease-in-out infinite;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,107,79,.35);}50%{box-shadow:0 0 0 6px rgba(11,107,79,0);}}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); transition:transform .12s ease, background .15s ease;}
.chip:active{transform:scale(.94);}
.chip.active{border-color:transparent; color:#fff;}

.list-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--green-100); color:var(--green-800); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
.list-main{flex:1; min-width:0;}
.list-main .t1{font-weight:700; font-size:14px;}
.list-main .t2{font-size:12px; color:var(--ink-soft);}

.status-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.status-row:last-child{border-bottom:none;}
.status-picker{display:flex; gap:6px; margin-left:auto;}

/* =========================================================================
   ✦ POLISH MODERN — blok ADITIF (ditambahkan setelah CSS lama, sebelum tag style ditutup)
   • Tidak menghapus/mengubah variabel :root / [data-theme] — hanya menambah.
   • Semua animasi memakai transform & opacity (ringan di HP low-end).
   • Ada fallback @supports untuk browser tanpa backdrop-filter.
   ========================================================================= */

/* ---------- 0. Variabel tambahan (perluas, bukan mengubah) ---------- */
:root{
  --ease-out:    cubic-bezier(.22,.61,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --shadow-depth:
    0 1px 2px rgba(8,50,36,.06),
    0 6px 16px -4px rgba(8,50,36,.10),
    0 14px 40px -10px rgba(8,50,36,.14);
  --glass-bg:  rgba(255,255,255,.72);
  --gold-line: rgba(232,199,102,.38);
  --ripple-white: rgba(255,255,255,.5);
  --ripple-tint:  rgba(15,131,98,.22);
}

/* ---------- 1. Navigasi & tab: underline geser + easing spring ---------- */
.tab-row{position:relative;}
.tab-btn{
  position:relative;
  transition:
    color .3s var(--ease-out),
    background .35s var(--ease-out),
    box-shadow .35s var(--ease-out),
    transform .18s var(--ease-spring);
}
.tab-btn.active{animation:tabPillIn .4s var(--ease-spring);}
.tab-btn.active::after{
  transform:translateX(-50%) scaleX(1);
  transform-origin:center;
  box-shadow:0 1px 6px rgba(201,162,39,.5);
  animation:tabLineIn .45s var(--ease-out);
}
@keyframes tabLineIn{
  from{transform:translateX(-50%) scaleX(0); opacity:0;}
  to  {transform:translateX(-50%) scaleX(1); opacity:1;}
}
@keyframes tabPillIn{
  from{transform:scale(.88); opacity:.35;}
  to  {transform:scale(1);    opacity:1;}
}

/* ---------- 2. Card & statistik: glass + depth + hover ---------- */
.card{
  background:var(--glass-bg);
  border:1px solid var(--gold-line);
  box-shadow:var(--shadow-depth);
  -webkit-backdrop-filter:blur(10px) saturate(1.25);
  backdrop-filter:blur(10px) saturate(1.25);
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out), border-color .3s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:var(--paper);}
}
@media(hover:hover){
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 2px 4px rgba(8,50,36,.05), 0 10px 24px -6px rgba(8,50,36,.14), 0 22px 60px -12px rgba(8,50,36,.18);
  }
}
.stat-box{
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 1px 2px rgba(8,50,36,.12),
    0 8px 20px -6px rgba(8,50,36,.28),
    inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
}
.stat-box::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,0) 48%);
  pointer-events:none;
}
@media(hover:hover){
  .stat-grid.linkable .stat-box:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 12px 28px -8px rgba(8,50,36,.38), inset 0 1px 0 rgba(255,255,255,.3);
  }
}
.fin-sum{
  background:var(--glass-bg);
  border:1px solid var(--gold-line);
  box-shadow:var(--shadow-depth);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}

/* ---------- 3. Badge status: gradasi tipis + pulse "belum absen" ---------- */
.status-btn{position:relative;}
.status-btn.sel{
  box-shadow:0 3px 10px rgba(0,0,0,.22);
  border-top:2px solid rgba(255,255,255,.4);
}
/* lapisan kilau gradasi di atas warna status apa pun (termasuk style inline JS) */
.status-btn.sel::before{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 55%);
  pointer-events:none;
}
/* Pulse halus pada tombol status yang BELUM dipilih ("belum absen") */
.status-btn:not(.sel)::before{
  content:""; position:absolute; inset:-3px; border-radius:12px;
  box-shadow:0 0 0 2px rgba(232,199,102,.5);
  opacity:0; animation:badgePulse 2.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes badgePulse{
  0%,100%{opacity:0; transform:scale(.96);}
  50%    {opacity:1; transform:scale(1.05);}
}
/* util: beri class .badge-pulse pada elemen badge "belum absen" mana pun */
.badge-pulse{animation:badgePulse 2.6s ease-in-out infinite;}
.fin-badge{background-image:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));}

/* ---------- 4. Tombol: ripple murni CSS + transisi konsisten ---------- */
.btn, .nav-btn, .icon-btn, .chip{position:relative; overflow:hidden;}
.btn::after, .nav-btn::after, .icon-btn::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:radial-gradient(circle at 50% 50%, var(--ripple-white) 0%, transparent 55%);
  opacity:0; transform:scale(0); pointer-events:none;
}
.btn-outline::after, .btn-danger::after, .btn-ghost::after{
  background:radial-gradient(circle at 50% 50%, var(--ripple-tint) 0%, transparent 55%);
}
.btn:active::after, .nav-btn:active::after, .icon-btn:active::after{animation:ripple .5s var(--ease-out);}
@keyframes ripple{
  0%  {opacity:.85; transform:scale(0);}
  100%{opacity:0;   transform:scale(2.6);}
}
.btn{
  transition:
    transform .18s var(--ease-spring),
    box-shadow .3s var(--ease-out),
    background .25s ease,
    color .2s ease,
    border-color .2s ease;
}
@media(hover:hover){
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 18px -4px rgba(11,107,79,.45);}
  .btn-gold:hover{transform:translateY(-1px); box-shadow:0 6px 18px -4px rgba(201,162,39,.5);}
  .btn-outline:hover{border-color:var(--green-700); background:var(--green-50);}
  .btn-danger:hover{border-color:var(--status-a); background:#FDF0F0;}
}

/* ---------- 5. Toast modern + skeleton loading ---------- */
.saved-toast{
  bottom:86px;
  border-radius:14px;
  padding:10px 18px;
  background:rgba(6,42,31,.88);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  border:1px solid var(--gold-line);
  font-size:12.5px; font-weight:600;
  box-shadow:0 10px 32px -8px rgba(8,50,36,.5), 0 2px 8px rgba(0,0,0,.22);
  transition:transform .4s var(--ease-spring), opacity .3s ease;
}
.saved-toast svg{width:14px; height:14px; stroke:#7FD9A8;}
@media(min-width:900px){ .saved-toast{bottom:24px;} }

/* Toast generik (pengganti alert() — pasang class .toast .show lewat JS) */
.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(18px);
  max-width:calc(100vw - 32px); z-index:90; opacity:0; pointer-events:none;
  border-radius:14px; padding:12px 18px; font-size:13px; font-weight:700;
  color:#fff; display:flex; align-items:center; gap:10px;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 32px -8px rgba(8,50,36,.5);
  transition:transform .4s var(--ease-spring), opacity .3s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
.toast-success{background:rgba(11,107,79,.92);}
.toast-error{background:rgba(185,50,50,.94);}
.toast-warn{background:rgba(176,122,10,.94);}
.toast-info{background:rgba(6,42,31,.9);}
@media(min-width:900px){ .toast{bottom:24px;} }

/* Skeleton shimmer (transform-only, aman low-end) */
.skeleton{
  position:relative; overflow:hidden; border-radius:10px;
  background:rgba(8,50,36,.07);
}
.skeleton::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
  transform:translateX(-100%);
  animation:shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer{100%{transform:translateX(100%);}}
.skeleton-card{height:92px; border-radius:var(--radius);}
.skeleton-line{height:13px; border-radius:6px; margin-bottom:9px;}
.skeleton-line.w60{width:60%;}
.skeleton-line.w40{width:40%;}
.skeleton-circle{border-radius:50%; width:40px; height:40px;}

/* ---------- 6. Login: mesh hijau-emas animasi + floating label ---------- */
.login-wrap{
  position:relative; overflow:hidden;
  background:linear-gradient(165deg, var(--green-950), var(--green-800) 70%, #0E5A46);
}
.login-wrap::before, .login-wrap::after{
  content:""; position:absolute; border-radius:50%;
  pointer-events:none; will-change:transform;
}
.login-wrap::before{
  width:72vmax; height:72vmax; left:-22vmax; top:-28vmax;
  background:radial-gradient(circle, rgba(232,199,102,.4), rgba(232,199,102,0) 55%);
  animation:meshA 16s ease-in-out infinite alternate;
}
.login-wrap::after{
  width:62vmax; height:62vmax; right:-20vmax; bottom:-24vmax;
  background:radial-gradient(circle, rgba(15,131,98,.55), rgba(15,131,98,0) 55%);
  animation:meshB 20s ease-in-out infinite alternate;
}
@keyframes meshA{from{transform:translate(0,0) scale(1);}   to{transform:translate(6%,8%) scale(1.15);}}
@keyframes meshB{from{transform:translate(0,0) scale(1.1);} to{transform:translate(-7%,-6%) scale(.92);}}

.login-card .field{position:relative; margin-bottom:16px;}
.login-card .field label{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  margin:0; padding:0 4px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  pointer-events:none; z-index:1;
  transition:top .28s var(--ease-out), transform .28s var(--ease-out), font-size .28s var(--ease-out), color .25s ease, background .25s ease, box-shadow .25s ease;
}
.login-card .field input{
  padding:17px 13px 15px; border-radius:12px; border-color:transparent;
  background:var(--green-50);
  transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.login-card .field input:focus{
  background:#fff; border-color:var(--green-700);
  box-shadow:0 0 0 3px rgba(15,131,98,.14);
}
.login-card .field:focus-within label,
.login-card .field:has(input:not(:placeholder-shown)) label{
  top:0; transform:translateY(-50%); font-size:11px; font-weight:800;
  color:var(--green-700); background:#fff; padding:1px 7px; border-radius:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:40px;}
.login-card .field .pwd-wrap input{padding-right:44px;}
.pwd-toggle{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  background:transparent; border:none; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;
}
.pwd-toggle svg{width:18px; height:18px; stroke:var(--ink-soft); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.pwd-toggle:active{opacity:.55;}

/* =========================================================================
   REDESIGN — fondasi visual baru (header sticky, hero, kartu kelas, ornament)
   Semua nilai ditambahkan di atas sistem lama; tidak menghapus komponen lama.
   ========================================================================= */

/* ---------- Ornamen geometris Islam (bintang 8 / pattern) ---------- */
.islamic-pattern{position:absolute; inset:0; pointer-events:none; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%23FFFFFF' stroke-width='1'%3E%3Cpath d='M32 4 L37 27 L60 32 L37 37 L32 60 L27 37 L4 32 L27 27 Z'/%3E%3Ccircle cx='32' cy='32' r='9'/%3E%3Cpath d='M0 32 H64 M32 0 V64'/%3E%3C/g%3E%3C/svg%3E"); background-size:64px 64px; opacity:.07;}
.islamic-pattern.dark{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%231B4332' stroke-width='1'%3E%3Cpath d='M32 4 L37 27 L60 32 L37 37 L32 60 L27 37 L4 32 L27 27 Z'/%3E%3Ccircle cx='32' cy='32' r='9'/%3E%3Cpath d='M0 32 H64 M32 0 V64'/%3E%3C/g%3E%3C/svg%3E"); opacity:.06;}
.star8-badge{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; flex-shrink:0;}
.star8-badge svg{width:22px; height:22px; stroke:var(--gold-600); fill:none; stroke-width:1.4;}
.islamic-divider{display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--gold-600);}
.islamic-divider::before, .islamic-divider::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(212,160,23,.5));}
.islamic-divider::after{background:linear-gradient(90deg, rgba(212,160,23,.5), transparent);}

/* ---------- Header: sticky, blur, tipis, aksen emas ---------- */
.app-header{
  position:sticky; top:0; z-index:30;
  background:rgba(245,240,232,.86);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  color:var(--ink);
  padding:10px 16px 12px;
  border-bottom:1px solid rgba(212,160,23,.22);
  box-shadow:0 1px 0 rgba(27,67,50,.05);
  overflow:hidden;
  transition:box-shadow .25s ease, background .25s ease;
}
.app-header.is-scrolled{background:rgba(245,240,232,.94); box-shadow:0 4px 18px rgba(27,67,50,.12);}
.app-header::before{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg, transparent, var(--gold-600), var(--gold-400), var(--gold-600), transparent); opacity:.7;}
.app-header::after{content:""; position:absolute; inset:0; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%231B4332' stroke-width='1'%3E%3Cpath d='M32 4 L37 27 L60 32 L37 37 L32 60 L27 37 L4 32 L27 27 Z'/%3E%3Ccircle cx='32' cy='32' r='9'/%3E%3Cpath d='M0 32 H64 M32 0 V64'/%3E%3C/g%3E%3C/svg%3E"); background-size:64px 64px; opacity:.05; pointer-events:none;}
.hdr-row{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.hdr-brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:15.5px; letter-spacing:.4px; color:var(--green-900); line-height:1.15; white-space:nowrap;}
.brand-sub{display:block; font-size:10px; color:var(--ink-soft); letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hdr-madrasah{display:none; align-items:center; gap:8px; padding-left:12px; border-left:1px solid var(--line); min-width:0;}
.hdr-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.hijri-chip{font-size:10.5px; font-weight:700; color:var(--gold-700); background:var(--gold-100); border:1px solid rgba(212,160,23,.35); padding:4px 10px; border-radius:16px; white-space:nowrap;}
.hdr-sec{display:flex; align-items:center; gap:8px; margin-top:8px; position:relative; z-index:1;}
@media(min-width:700px){
  .hdr-madrasah{display:flex; flex:1 1 auto; justify-content:flex-start;}
  .hdr-brand{flex:0 1 auto;}
  .hdr-right{flex:0 0 auto;}
  .hdr-sec{display:none;}
}
/* penyelarasan label lama di header terang */
.app-header .madrasah-name{color:var(--green-900); font-family:var(--font-display); font-size:16px;}
.app-header .madrasah-loc{color:var(--ink-soft); opacity:.9;}
.app-header .header-top{padding:0;}
.app-header .header-titles{text-align:left;}
.app-header .header-hijri{text-align:left; margin:0; font-size:10.5px; color:var(--ink-soft); opacity:1;}
.app-header .login-chip{display:inline-flex; align-items:center; gap:6px; margin:0; padding:6px 13px; border-radius:20px; background:linear-gradient(135deg, var(--gold-600), var(--gold-500)); border:1px solid rgba(169,127,18,.45); color:#2A1F05; font-weight:700; font-size:11.5px; box-shadow:0 2px 8px rgba(169,127,18,.3);}
.app-header .login-chip svg{stroke:#2A1F05;}
.app-header .role-badge{background:var(--gold-100); color:var(--gold-700); border-color:rgba(212,160,23,.4);}
.app-header .bismillah{display:none;}

/* ---------- Hero landing (tamu) ---------- */
.hero{position:relative; overflow:hidden; border-radius:var(--radius); background:linear-gradient(150deg, var(--green-900) 0%, var(--green-800) 55%, var(--green-700) 100%); color:#fff; padding:24px 20px 20px; margin-bottom:16px; box-shadow:0 10px 26px rgba(27,67,50,.18);}
.hero .islamic-pattern{opacity:.08;}
.hero::after{content:""; position:absolute; right:-50px; top:-50px; width:190px; height:190px; border-radius:50%; background:radial-gradient(circle, rgba(223,184,79,.28), transparent 65%); pointer-events:none;}
.hero-title{font-family:var(--font-display); font-size:27px; font-weight:800; line-height:1.1; margin:0 0 4px; position:relative; z-index:1;}
.hero-sub{font-size:13.5px; font-weight:700; color:rgba(255,255,255,.9); margin:0 0 3px; position:relative; z-index:1;}
.hero-desc{font-size:12px; color:rgba(255,255,255,.72); margin:0 0 16px; position:relative; z-index:1;}
.hero-cta{display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1;}
.hero-btn{display:inline-flex; align-items:center; gap:8px; border:none; border-radius:11px; padding:11px 18px; font-weight:700; font-size:13.5px; transition:transform .12s ease, box-shadow .18s ease;}
.hero-btn:active{transform:scale(.96);}
.hero-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.hero-btn-primary{background:linear-gradient(135deg, var(--gold-600), var(--gold-500)); color:#2A1F05; box-shadow:0 6px 16px rgba(0,0,0,.22);}
.hero-btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);}
.hero-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:18px; position:relative; z-index:1;}
@media(min-width:700px){ .hero-stats{grid-template-columns:repeat(4,1fr);} }
.hero-stat{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:11px 12px; text-align:left;}
.hero-stat .num{font-family:var(--font-mono); font-size:23px; font-weight:700; line-height:1; letter-spacing:-.5px;}
.hero-stat .lbl{font-size:10.5px; color:rgba(255,255,255,.78); margin-top:4px; font-weight:600;}

/* ---------- Kartu Kelas ---------- */
.class-grid{display:grid; gap:12px; margin-bottom:14px;}
@media(min-width:700px){ .class-grid{grid-template-columns:repeat(2,1fr);} }
.class-card{position:relative; background:var(--paper); border:1px solid rgba(27,67,50,.08); border-radius:var(--radius); padding:15px 16px 14px; box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease; display:flex; flex-direction:column; gap:10px; text-align:left; width:100%; overflow:hidden; cursor:pointer;}
.class-card::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--gold-600) 0%, rgba(212,160,23,.25) 60%, transparent);}
.class-card:hover{transform:translateY(-4px); box-shadow:0 12px 26px rgba(27,67,50,.14);}
.class-card:active{transform:translateY(-1px) scale(.995);}
.cc-head{display:flex; align-items:center; gap:10px; min-width:0;}
.cc-icon{width:42px; height:42px; border-radius:12px; background:var(--green-100); color:var(--green-800); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.cc-icon svg{width:20px; height:20px; stroke:var(--green-800); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.cc-txt{flex:1; min-width:0;}
.cc-name{font-family:var(--font-display); font-weight:700; color:var(--green-900); font-size:16px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cc-meta{font-size:11.5px; color:var(--ink-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cc-edit{flex-shrink:0;}
.cc-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.cc-stat{background:var(--green-50); border-radius:10px; padding:8px 3px; text-align:center; min-width:0;}
.cc-stat .n{font-family:var(--font-mono); font-weight:700; font-size:15px; line-height:1; letter-spacing:-.3px;}
.cc-stat .l{font-size:9px; color:var(--ink-soft); margin-top:3px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
.cc-n-h{color:var(--status-h);} .cc-n-s{color:var(--status-s);} .cc-n-i{color:var(--status-i);} .cc-n-a{color:var(--status-a);}
.cc-foot{display:flex; align-items:center; gap:10px;}
.cc-bar{flex:1; height:7px; background:var(--green-50); border-radius:6px; overflow:hidden;}
.cc-bar-fill{height:100%; background:linear-gradient(90deg, var(--status-h), #58B98A); border-radius:6px; transition:width .6s ease;}
.cc-pct{font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--status-h); white-space:nowrap;}

/* angka data memakai font mono */
.stat-box .num{font-family:var(--font-mono); letter-spacing:-.5px;}
.bcode-num{font-family:var(--font-mono);}

/* ---------- 7. Aksesibilitas: hormati prefers-reduced-motion ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* =========================================================================
   ✦ UI KIT (toast undo, confirm modal, indikator koneksi, badge 100%, confetti)
   Semua elemen dipasang di #uiLayer (di luar #root) agar selamat dari render().
   ========================================================================= */
.conn-dot{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  margin-left:8px; vertical-align:middle; border:1px solid rgba(255,255,255,.5);
  transition:background .3s ease, box-shadow .3s ease;
}
.conn-on{ background:#4ADE80; box-shadow:0 0 6px rgba(74,222,128,.9); animation:connPulse 2.4s ease-in-out infinite; }
.conn-sync{ background:#F2C94C; box-shadow:0 0 6px rgba(242,201,76,.9); }
.conn-off{ background:#F87171; box-shadow:0 0 6px rgba(248,113,113,.9); }
@keyframes connPulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

.toast-undo{ background:rgba(11,107,79,.95); padding-right:8px; cursor:default; }
.toast-undo-btn{
  flex-shrink:0; margin-left:4px; border:0; cursor:pointer;
  background:linear-gradient(135deg, var(--gold-600,#C9A227), var(--gold-400,#E8C766));
  color:#3A2E00; font-size:12px; font-weight:800; border-radius:9px; padding:6px 12px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  transition:transform .15s var(--ease-spring, cubic-bezier(.34,1.56,.64,1)), box-shadow .2s ease;
}
.toast-undo-btn:active{ transform:scale(.92); }
.toast-progress{
  position:absolute; left:0; bottom:0; height:3px; width:100%;
  background:linear-gradient(90deg, var(--gold-600,#C9A227), var(--gold-300,#F2D98C));
  transition:width 5s linear; border-radius:0 0 14px 14px;
}
.toast-progress.halt{ transition:none; }

.ui-confirm{
  position:fixed; inset:0; z-index:110; display:flex; align-items:center; justify-content:center;
  background:rgba(6,31,22,.55); padding:20px;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  animation:uiFadeIn .18s ease;
}
.ui-confirm-card{
  background:var(--paper,#fff); border:1px solid var(--gold-line, rgba(232,199,102,.38));
  border-radius:16px; box-shadow:var(--shadow-depth, 0 14px 40px -10px rgba(8,50,36,.14));
  max-width:360px; width:100%; padding:18px;
  animation:uiPopIn .25s cubic-bezier(.34,1.56,.64,1);
}
.ui-confirm-title{ margin:0 0 8px; font-size:15px; font-weight:800; color:var(--green-900,#0B6B4F); }
.ui-confirm-body{ font-size:13px; color:var(--ink,#22302A); line-height:1.5; }
.ui-confirm-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.ui-prompt-input{
  width:100%; box-sizing:border-box; margin-top:10px; padding:10px 12px;
  border:1.5px solid var(--line,#D8E2DB); border-radius:10px; font-size:14px;
  background:var(--green-50,#F0F7F3); color:var(--ink,#22302A);
}
.ui-prompt-input:focus{ outline:none; border-color:var(--green-700,#0B6B4F); box-shadow:0 0 0 3px rgba(15,131,98,.14); }
@keyframes uiFadeIn{ from{opacity:0;} }
@keyframes uiPopIn{ from{transform:scale(.9); opacity:0;} }

.att100-badge{
  display:inline-flex; align-items:center; gap:3px; margin-left:8px; padding:2px 8px;
  border-radius:999px; font-size:9.5px; font-weight:800; color:#3A2E00;
  background:linear-gradient(135deg, var(--gold-400,#E8C766), var(--gold-200,#F9E9B8));
  border:1px solid rgba(201,162,39,.45); box-shadow:0 1px 3px rgba(201,162,39,.35);
  vertical-align:middle;
}
.att100-badge svg{ width:9px; height:9px; stroke:#7A5A00; }

.recap-pager{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin-top:12px; font-size:12px; color:var(--ink-soft,#5B6B62);
}
.recap-pager .btn:disabled{ opacity:.4; pointer-events:none; }

.confetti-wrap{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:120; }
.confetti-p{
  position:absolute; border-radius:2px; opacity:0;
  animation-name:confFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
}
@keyframes confFall{
  0%{ opacity:0; }
  8%{ opacity:1; }
  100%{ transform:translateY(105vh) rotate(720deg); opacity:.1; }
}

/* =========================================================================
   ✦ DOKUMENTASI KEGIATAN — blok ADITIF
   • Foto & video binary disimpan di IndexedDB (DocStore), metadata ringan di
     localStorage (mda_dokMeta). Semua berjalan offline penuh.
   • Galeri foto: grid 2 kolom di HP (3 kolom di layar lebih lebar) + lightbox.
   • Galeri video: pemutar HTML5 <video controls> responsif.
   ========================================================================= */
.doc-upload-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.doc-upload-actions .btn{padding:12px 8px; font-size:12.5px; text-align:center;}
.doc-pending{
  margin-top:14px; border:1.5px dashed var(--gold-600); border-radius:12px; padding:12px;
  background:var(--gold-100);
}
.doc-pending-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; color:var(--green-900); font-weight:800;}
.doc-pending-head svg{width:14px; height:14px; stroke:var(--green-800); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

/* =========================================================================
   ✦ SLIDESHOW FOTO DASHBOARD — blok ADITIF
   • Foto disimpan sebagai base64 JPEG terkompresi di localStorage
     (key mda_slides, via Store) — tanpa foto area disembunyikan otomatis.
   • Tampilan "letterbox blur" (ala Instagram Story): foto TAMPIL UTUH via
     object-fit:contain di lapisan depan + latar blur dari foto yang sama
     (object-fit:cover + filter blur) — TIDAK ADA crop sama sekali.
   • Tinggi kontainer ADAPTIF mengikuti rasio foto aktif (dvh fallback vh,
     clamp adaptif); animasi hanya transform/opacity; touch-action benar
     utk Android; fallback aspect-ratio lama via padding-top trick.
   • Slide berganti otomatis tiap 3 detik; dots indikator; admin kelola.
   ========================================================================= */
.slide-show{margin-bottom:14px;}
.slide-track{
  position:relative; width:100%;
  aspect-ratio:16/7.5;
  min-height:clamp(110px, 24vw, 200px);
  max-height:min(60vh, 420px);
  border-radius:16px; overflow:hidden;
  border:1px solid var(--gold-line); box-shadow:var(--shadow-depth);
  background:#0B2A1E;
  touch-action:pan-y;
  transition:height .3s ease;
}
@supports (height:1dvh){
  .slide-track{max-height:min(60dvh, 420px);}
}
@supports not (aspect-ratio: 1/1){
  /* fallback WebView lama tanpa aspect-ratio: tinggi via spacer padding-top */
  .slide-track::before{content:""; display:block; float:left; padding-top:46.875%;}
  .slide-track::after{content:""; display:block; clear:both;}
}
.slide-frame{
  position:absolute; inset:0;
  opacity:0; transform:translateX(14px) scale(.995);
  transition:opacity .7s ease, transform .7s ease;
  pointer-events:none;
}
.slide-frame.on{opacity:1; transform:translateX(0) scale(1); pointer-events:auto;}
/* lapisan belakang: foto yang sama, cover + blur (bukan crop — efek letterbox) */
.slide-bg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center;
  filter:blur(18px) brightness(.72) saturate(1.05);
  transform:scale(1.16);
}
/* lapisan depan: foto UTUH, contain — tidak pernah terpotong, selalu senter */
.slide-fg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; object-position:center;
  display:block;
}
.slide-cap{
  position:absolute; left:10px; bottom:10px; z-index:2; max-width:calc(100% - 20px);
  background:rgba(6,42,31,.55); color:#fff; font-size:12px; font-weight:600;
  padding:6px 12px; border-radius:10px; backdrop-filter:blur(2px);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.slide-dots{display:flex; justify-content:center; gap:7px; margin:8px 0 2px;}
.slide-dot{
  width:8px; height:8px; border-radius:50%; border:none; padding:0;
  background:var(--line); cursor:pointer;
  transition:transform .2s var(--ease-spring), background .2s ease, width .2s ease;
}
.slide-dot.on{background:var(--gold-600); width:20px; border-radius:5px;}
.slide-dot:active{transform:scale(1.4);}
.slide-admin-wrap{margin-bottom:14px;}
.slide-admin{
  margin-top:10px; padding:14px; border:1.5px solid var(--gold-line); border-radius:14px;
  background:var(--paper); box-shadow:var(--shadow);
}
.slide-list{display:flex; flex-direction:column; gap:8px;}
.slide-item{
  display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line);
  border-radius:12px; background:#fff;
}
.slide-item img{width:52px; height:52px; object-fit:cover; border-radius:8px; flex-shrink:0;}
.slide-item-txt{flex:1; min-width:0; font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.slide-del{

  display:flex; align-items:center; justify-content:center;
}

<script>
/* =========================================================================
   DIGITAL ATTENDANCE — MADRASAH DINIYAH
   Offline-first single-file app. All data lives in localStorage.
   ========================================================================= */

/* ---------------------------- Storage layer ----------------------------
   PILIHAN PENYIMPANAN & REKOMENDASI
   Aplikasi ini 100% offline dan menyimpan data di browser perangkat.

   • localStorage (dipakai di sini): cocok untuk data ringan & NON-sensitif
     yang harus bertahan antar-sesi tanpa perlu kueri (profil, kelas, santri,
     absensi). Keterbatasan: ±5–10 MB, dan TIDAK aman untuk data sensitif.
   • sessionStorage (untuk sesi login): hilang saat tab ditutup — pas untuk
     status masuk sementara.
   • IndexedDB: untuk data terstruktur besar (mis. ribuan santri + riwayat
     absensi berbulan-bulan, foto/gambar). Async, kapasitas jauh lebih besar,
     mendukung indeks & kueri. DAPAT jadi pengganti yang lebih baik bila data
     membengkak (indikasi: error "Penyimpanan penuh" di Store.set).
   • Backend + database (mis. server REST + PostgreSQL/MySQL/Firebase):
     DIPERLUKAN untuk produksi bila data bersifat penting/sensitif — terutama
     modul KEUANGAN (catatan pembayaran) dan identitas santri. Alasan:
       - data terpusat, tidak hilang bila perangkat rusak/hilang,
       - multi-perangkat & banyak guru berbagi data yang sama,
       - otorisasi nyata di server (validasi input & akses TIDAK bisa
         diandalkan hanya dari sisi client),
       - audit trail, backup terpusat, dan kepatuhan data pribadi.
   Catatan: localStorage bukan perlindungan keamanan — kode & data dapat
   dibaca/diubah pengguna dari DevTools. Jangan simpan token/secret di sini.
   ========================================================================= */
const DB_PREFIX = 'mda_'; // Madrasah Digital Attendance
const Store = {
  get(key, fallback){
    try{
      const raw = localStorage.getItem(DB_PREFIX+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  set(key, value, silent){
    try{
      localStorage.setItem(DB_PREFIX+key, JSON.stringify(value));
      if(!silent) flashSaved();
      return true;
    }catch(e){
      showToast('Gagal menyimpan data ke perangkat. Penyimpanan mungkin penuh.', 'error');
      return false;
    }
  }
};

let savedTimer=null;
function flashSaved(){
  const t = document.getElementById('savedToast');
  if(!t) return;
  t.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* =========================================================================
   ✦ UI KIT MODERN (TAMBAHAN — tidak mengubah render()/App{}/skema localStorage)
   Semua elemen dipasang di #uiLayer (di luar #root) sehingga tetap hidup
   saat render() mengganti isi root. Semua fitur berjalan offline penuh.
   ========================================================================= */
function uiLayer(){
  let el = document.getElementById('uiLayer');
  if(!el){ el = document.createElement('div'); el.id = 'uiLayer'; document.body.appendChild(el); }
  return el;
}

/* ---------- 4a. Toast non-blocking: showToast(message, type) ----------
   type: 'success' (default) | 'error' | 'warn' | 'info'. Pengganti alert(). */
function showToast(message, type, ms){
  const layer = uiLayer();
  const t = document.createElement('div');
  t.className = 'toast show toast-'+(type||'success');
  t.innerHTML = '<span style="flex:1;">'+escapeHtml(message)+'</span>';
  layer.appendChild(t);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 400); }, ms || 2600);
}

/* ---------- 4b. Confirm kustom non-blocking: showConfirm(message, onConfirm) ---------- */
const UI = {
  confirmEl: null,
  _confirmCb: null,
  closeConfirm(result){
    if(this.confirmEl){ this.confirmEl.remove(); this.confirmEl = null; }
    if(this._confirmCb){ const cb = this._confirmCb; this._confirmCb = null; cb(!!result); }
  },
  confirm(opts){
    this.closeConfirm(false);
    const el = document.createElement('div');
    el.className = 'ui-confirm';
    el.innerHTML = `<div class="ui-confirm-card">
      <h3 class="ui-confirm-title">${escapeHtml(opts.title || 'Konfirmasi')}</h3>

/* ---------- 2a. Getar + beep (offline, tanpa file audio) ---------- */
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
let __audioCtx = null;
function beep(freq, dur, type){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    __audioCtx = __audioCtx || new AC();
    const o = __audioCtx.createOscillator();
    const g = __audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.0001, __audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, __audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, __audioCtx.currentTime + (dur || 140) / 1000);
    o.connect(g); g.connect(__audioCtx.destination);
    o.start(); o.stop(__audioCtx.currentTime + (dur || 140) / 1000);
  }catch(e){}
}

/* ---------- 1a. Count-up angka statistik (0 → nilai asli, ±800ms) ---------- */
function countUp(el, target, dur){
  if(!el || isNaN(target)) return;
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const p = Math.min(1, (now - t0) / (dur || 800));
    el.textContent = Math.round(target * ease(p));
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- 1b. Deteksi alpa beruntun (3 hari berturut-turut) ---------- */
function attendanceStreak(endIso, studentId, classId, maxDays){
  const att = attendance();
  let best = 0, run = 0;
  const end = new Date(endIso + 'T00:00:00');
  for(let i = 0; i < (maxDays || 14); i++){
    const d = new Date(end); d.setDate(d.getDate() - i);
    const v = ((att[isoOf(d)] || {})[classId] || {})[studentId];
    if(v === 'A'){ run++; if(run > best) best = run; } else run = 0;
  }
  return best;
}

/* ---------- 6a. Peta santri kehadiran 100% sebulan terakhir ---------- */
function lastMonthPerfectMap(){
  const map = {};
  const from = isoOf(new Date(Date.now() - 29 * 864e5));
  const to = todayISO();
  const att = attendance();
  Object.keys(att).forEach(dateIso=>{
    if(dateIso < from || dateIso > to) return;
    Object.values(att[dateIso]).forEach(cRec=>{
      if(!cRec || typeof cRec !== 'object') return;
      Object.keys(cRec).forEach(sid=>{
        const v = cRec[sid];
        if(!v) return;
        const e = map[sid] = map[sid] || {total:0, h:0};
        e.total++; if(v === 'H') e.h++;
      });
    });
  });
  const out = {};
  students().forEach(s=>{ const e = map[s.id]; if(e && e.total > 0 && e.h === e.total) out[s.id] = true; });
  return out;
}

/* ---------------------------- API & Sinkronisasi (hybrid) ----------------------------
   Mode HYBRID: aplikasi tetap offline-first (localStorage sumber baca & bekerja penuh
   tanpa internet). Lapisan ini menambahkan sinkronisasi ke backend:
     • Login: coba backend dulu (JWT); bila offline, fallback ke password lokal.
     • Push:  setiap penyimpanan lokal juga diunggah ke server (best-effort, diam-diam).
     • Pull:  saat login/startup, data remote ditarik & digabung ke penyimpanan lokal.
   Semua kegagalan jaringan diabaikan diam-diam agar tidak mengganggu mode offline.
   Backend menyediakan autentikasi nyata, validasi server, dan cadangan terpusat untuk
   modul penting (keuangan, data santri). Base URL default '' = same-origin (aplikasi
   disajikan dari server). Atur window.API_BASE bila frontend dihosting terpisah.
   ========================================================================= */
const API = {
  base: (typeof window.API_BASE !== 'undefined' && window.API_BASE) ? window.API_BASE : '',
  tokenKey: 'mda_jwt',
  token(){ return sessionStorage.getItem(this.tokenKey); },
  setToken(t){ if(t) sessionStorage.setItem(this.tokenKey, t); else sessionStorage.removeItem(this.tokenKey); },
  async req(path, opts={}){
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    const t = this.token();
    if(t) headers['Authorization'] = 'Bearer '+t;
    let res;
    try{ res = await fetch(this.base+path, Object.assign({}, opts, {headers})); }
    catch(e){ const err=new Error('Offline'); err.status=0; throw err; }
    if(res.status===204) return null;
    let data=null; try{ data=await res.json(); }catch(e){}
    if(!res.ok){ const err=new Error((data&&data.error)||('Kesalahan server ('+res.status+')')); err.status=res.status; throw err; }
    return data;
  }
};
async function apiLogin(username, password){
  const r = await API.req('/api/auth/login', {method:'POST', body:JSON.stringify({username, password})});
  API.setToken(r.token);
  return r.user;
}
function apiAvailable(){ return !!API.token(); }

/* ---------- galeri bersama (cloud) ----------
   Bila halaman dibuka dari Vercel, galeri cloud = origin ini; bila dibuka dari
   PC (LAN), tetap memakai galeri cloud di absensi-mudah.vercel.app (via CORS).
   Vercel hanya menyediakan LIST publik; upload & hapus diurus server PC
   (yang punya token Blob + JWT_SECRET di .env). */
const GAL = {
  cloud: 'https://absensi-mudah.vercel.app',
  api(){ return (location.origin === this.cloud || location.hostname.indexOf('.vercel.app') !== -1) ? location.origin : this.cloud; }
};
/* Situs publik (hosting Vercel) hanya untuk lihat; login & kelola data
   hanya dari server madrasah (jaringan lokal). */
function isPublicSite(){ return location.hostname.indexOf('.vercel.app') !== -1; }
async function galReq(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const t = API.token();
  if(t) headers['Authorization'] = 'Bearer '+t;
  let res;
  try{ res = await fetch(GAL.api()+path, Object.assign({}, opts, {headers})); }
  catch(e){ const err=new Error('Offline'); err.status=0; throw err; }
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.error)||('Kesalahan server ('+res.status+')')); err.status=res.status; throw err; }
  return data;
}

const Sync = {
  _q: 0,
  online: false,
  async ids(){
    const [cls, sts] = await Promise.all([
      API.req('/api/classes').catch(()=>[]),
      API.req('/api/students').catch(()=>[]),
    ]);
    const byName={}, byNis={};
    (cls||[]).forEach(c=>byName[String(c.name).toLowerCase()]=c.id);
    (sts||[]).forEach(s=>byNis[String(s.nis).toLowerCase()]=s.id);
    return {byName, byNis};
  },
  async pushAll(){
    if(!apiAvailable()) return;
    try{
      const p = profile();
      await API.req('/api/profile',{method:'PUT',body:JSON.stringify({
        name:p.name, logo:p.logo||null, address:p.address, village:p.village,
        district:p.district, regency:p.regency, province:p.province, phone:p.phone,
        motto:p.motto, bg_color:p.bgColor||'#F7F3E7', bg_image:p.bgImage||null})}).catch(()=>{});
      const {byName, byNis} = await this.ids();
      const cls = classes();
      for(const c of cls){
        const body={name:c.name};
        const sid = byName[String(c.name).toLowerCase()];
        try{ if(sid) await API.req('/api/classes/'+sid,{method:'PUT',body:JSON.stringify(body)});
             else await API.req('/api/classes',{method:'POST',body:JSON.stringify(body)}); }catch(e){}
      }
      const sts = students();
      for(const s of sts){
        const cc = cls.find(c=>c.id===s.classId);
        const body={nis:s.nis, name:s.name, gender:(s.gender||'L'),
          class_id: cc ? (byName[String(cc.name).toLowerCase()]||null) : null,
          photo: s.photo||null};
        const sid = byNis[String(s.nis).toLowerCase()];
        try{ if(sid) await API.req('/api/students/'+sid,{method:'PUT',body:JSON.stringify(body)});
             else await API.req('/api/students',{method:'POST',body:JSON.stringify(body)}); }catch(e){}
      }
      const att = attendance()||{};
      for(const date of Object.keys(att)){
        const perClass = att[date]||{};
        for(const classId of Object.keys(perClass)){
          const cc = cls.find(c=>c.id===classId);
          if(!cc) continue;
          const cid = byName[String(cc.name).toLowerCase()];
          if(!cid) continue;
          const items = Object.entries(perClass[classId]||{}).map(([stuId,status])=>{
            const s = sts.find(x=>x.id===stuId);
            const sid = s ? byNis[String(s.nis).toLowerCase()] : null;
            return sid ? {student_id:sid, status} : null;
          }).filter(Boolean);
          if(items.length) await API.req('/api/attendance/bulk',{method:'PUT',body:JSON.stringify({date, class_id:cid, items})}).catch(()=>{});
        }
      }
      // Keuangan: cerminkan catatan pembayaran lokal ke /api/payments.
      // Mirror penuh (hapus lalu unggah ulang) agar server selalu sama dengan
      // kondisi lokal; hanya berjalan bila ada catatan lokal (hindari wipe
      // bila perangkat reset).
      const fin = finance()||[];
      if(fin.length){
        let serverPays = [];
        try{ serverPays = await API.req('/api/payments')||[]; }catch(e){ serverPays=[]; }
        for(const sp of serverPays){ try{ await API.req('/api/payments/'+sp.id,{method:'DELETE'}); }catch(e){} }
        for(const f of fin){
          const s = sts.find(x=>x.id===f.studentId);
          const sid = s ? byNis[String(s.nis).toLowerCase()] : null;
          if(!sid) continue;
          const amount = Math.round(Number(f.amount)||0);
          if(amount<=0) continue;
          const itemLabel = f.item ? (payItem(f.item).label||f.item) : '';
          const note = [itemLabel, (f.note||'').trim()].filter(Boolean).join(' — ');
          try{
            await API.req('/api/payments',{method:'POST',body:JSON.stringify({
              student_id: sid, amount, note, paid_at: f.date||todayISO()
            })});
          }catch(e){}
        }
      }
      // Guru: sinkronkan akun guru ke server (mirror role 'guru').
      // Akun dibuat dengan password plaintext saat penambahan (lihat
      // bindSettings) karena lokal hanya menyimpan hash; akun server yang
      // tidak ada padanannya di lokal dihapus.
      let srvUsers = [];
      try{ srvUsers = await API.req('/api/users')||[]; }catch(e){ srvUsers=[]; }
      const localT = teachers();
      const localTNames = new Set(localT.map(t=>String(t.username).toLowerCase()));
      for(const u of srvUsers){
        if(u.role!=='guru') continue;
        if(!localTNames.has(String(u.username).toLowerCase())){
          try{ await API.req('/api/users/'+u.id,{method:'DELETE'}); }catch(e){}
        }
      }
      this.online = true;
    }catch(e){ this.online=false; }
  },
  queued(){ const self=this; if(self._q) clearTimeout(self._q); self._q=setTimeout(()=>{ self._q=0; self.pushAll(); try{ SC.queued(); }catch(e){} }, 800); },
  async pull(){
    if(!apiAvailable()) return;
    try{
      const [prof, cls, sts] = await Promise.all([
        API.req('/api/profile').catch(()=>null),
        API.req('/api/classes').catch(()=>[]),
        API.req('/api/students').catch(()=>[]),
      ]);
      if(prof && (prof.name || prof.logo || prof.motto || prof.bg_color)){
        const p = profile();
        Store.set('profile', {...p,
          name: prof.name||p.name, logo: prof.logo||p.logo, address: prof.address||p.address,
          village: prof.village||p.village, district: prof.district||p.district,
          regency: prof.regency||p.regency, province: prof.province||p.province,
          phone: prof.phone||p.phone, motto: prof.motto||p.motto,
          bgColor: prof.bg_color||p.bgColor, bgImage: prof.bg_image||p.bgImage}, true);
      }
      if((cls||[]).length){
        const local = classes();
        const names = new Set(local.map(c=>String(c.name).toLowerCase()));
        const merged = local.slice();
        for(const c of cls) if(!names.has(String(c.name).toLowerCase())) merged.push({id:uid(), name:c.name});
        Store.set('classes', merged, true);
      }
      if((sts||[]).length){
        const local = students();
        const nises = new Set(local.map(s=>String(s.nis).toLowerCase()));
        const clsMap = {}; classes().forEach(c=>clsMap[String(c.name).toLowerCase()]=c.id);
        const merged = local.slice();
        for(const s of sts) if(!nises.has(String(s.nis).toLowerCase()))
          merged.push({id:uid(), nis:s.nis, name:s.name, gender:s.gender||'L',
            classId: s.class_name ? (clsMap[String(s.class_name).toLowerCase()]||null) : null,
            photo: s.photo||null});
Store.set('students', merged, true);
      }
      this.online = true;
      render();
      try{ await SC.pull(); }catch(e){}
    }catch(e){ this.online=false; }
  }
};

/* ---------------------------- Sinkronisasi Cloud (Supabase) ----------------------------
   "Mode Cloud": salin data (santri, foto, absensi, dsb.) ke proyek Supabase gratis agar
   tiap perangkat yang memakai konfigurasi sama otomatis memuat data terbaru. Tetap
   offline-first: bila gagal/offline, aplikasi bekerja penuh dengan data lokal.
     • Login: setiap perangkat harus MASUK dengan Email & Sandi akun Supabase Auth.
              Tanpa login yang sah, tidak ada data yang bisa dibaca/ditulis (RLS: anon ditolak).
     • Push: setiap penyimpanan lokal (lewat Sync.queued) → unggah payload + foto baru.
     • Pull: saat login & saat aplikasi dibuka → bila data remote lebih baru, diterapkan.
     • Token akses disimpan di sessionStorage; refresh token di localStorage agar tetap
       masuk setelah aplikasi ditutup. Bila kadaluarsa, cukup masukkan sandi lagi.
     • Konflik: "terbaru menang" per dokumen utuh (last-write-wins).
   Konfigurasi URL & Anon Key via Lainnya → Sinkronisasi Cloud (Supabase).
   ========================================================================= */
const SC = {
  _q: 0,
  online: false,
  get c(){
    const s = appSettings() || {};
    const c = s.cloud || {};
    return { url:(c.url||'').trim().replace(/\/+$/,''), anon:(c.anon||'').trim(), row:(c.row||'madrasah-1'), email:(c.email||'').trim() };
  },
  configured(){ const c=this.c; return !!(c.url && c.anon); },
  api(path){ return this.c.url + '/rest/v1' + path; },
  storage(path){ return this.c.url + '/storage/v1/object/public/mda-fotos/' + path; },
  token(){ return sessionStorage.getItem('mda_sb_token') || Store.get('sbToken', ''); },
  setToken(t){
    if(t){ sessionStorage.setItem('mda_sb_token', t); Store.set('sbToken', t, true); }
    else{ sessionStorage.removeItem('mda_sb_token'); Store.set('sbToken', '', true); }
  },
  refreshStored(){ return Store.get('sbRefresh', ''); },
  setRefreshStored(t){ if(t) Store.set('sbRefresh', t, true); else { try{ localStorage.removeItem(DB_PREFIX+'sbRefresh'); }catch(e){} } },
  async login(email, password){
    const c = this.c;
    if(!c.url || !email || !password) return false;
    try{
      const res = await fetch(c.url + '/auth/v1/token?grant_type=password', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', apikey:c.anon, 'Authorization':'Bearer '+c.anon },
        body: JSON.stringify({ email, password })
      });
      if(!res.ok) return false;
      const d = await res.json();
      this.setToken(d.access_token);
      if(d.refresh_token) this.setRefreshStored(d.refresh_token);
      this._sesFail = false;
      return true;
    }catch(e){ return false; }
  },
  async refresh(){
    const rf = this.refreshStored();
    if(!rf) return false;
    try{
      const c = this.c;
      const res = await fetch(c.url + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', apikey:c.anon, 'Authorization':'Bearer '+c.anon },
        body: JSON.stringify({ refresh_token: rf })
      });
      if(!res.ok){
        this.setRefreshStored(null);
        this.setToken(null);
        return false;
      }
      const d = await res.json();
      this.setToken(d.access_token);
      if(d.refresh_token) this.setRefreshStored(d.refresh_token);
      return true;
    }catch(e){ return false; }
  },
  async ensureSession(){
    if(this.token()) return true;
    if(this._ses) return this._ses;
    this._ses = (async()=>{ const ok = await this.refresh(); this._ses = null; if(!ok) this._sesFail = true; return ok; })();
    return this._ses;
  },
  async authFetch(url, opts={}, _retry){
    if(!await this.ensureSession()) throw new Error(this._sesFail ? 'Sesi berakhir — isi Email & Sandi lalu tekan Simpan' : 'Belum masuk akun cloud');
    const t = this.token();
    const headers = Object.assign({ apikey:this.c.anon, 'Authorization':'Bearer '+t, 'Content-Type':'application/json' }, opts.headers||{});
    let res;
    try{ res = await fetch(url, Object.assign({}, opts, {headers})); }
    catch(e){ throw new Error('Offline'); }
    if(res.status===401 && !_retry){ if(await this.refresh()) return this.authFetch(url, opts, true); }
    return res;
  },
  async req(path, opts={}){
    const res = await this.authFetch(this.api(path), opts);
    if(res.status===204) return null;
    let data=null, raw=''; try{ raw = await res.text(); data = raw ? JSON.parse(raw) : null; }catch(e){ data=null; }
    if(!res.ok){
      let msg = 'Supabase '+res.status;
      if(data && data.message) msg += ' — ' + data.message;
      else if(data && data.details) msg += ' — ' + data.details;

    }catch(e){ this.online = false; this.lastErr = (e && e.message) ? e.message : 'push gagal'; }
  },
  queued(){ const self=this; if(self._q) clearTimeout(self._q); self._q=setTimeout(()=>{ self._q=0; self.push(false); }, 1500); },
  async reqPublic(path){
    const c = this.c;

    if(!res.ok) throw new Error('Supabase '+res.status);

  async pull(_public){
    if(!this.configured()) return;
    this.lastErr = null;

      const c = this.c;
      const rows = _public
        ? await this.reqPublic('/mda_sync?id=eq.'+encodeURIComponent(c.row)+'&select=payload')
        : await this.req('/mda_sync?id=eq.'+encodeURIComponent(c.row)+'&select=payload');
      this.applyRows(rows);
    }catch(e){ if(!_public) this.lastErr = (e && e.message) ? e.message : 'pull gagal'; }
  },
  applyRows(rows){
    const row = Array.isArray(rows) ? rows[0] : null;
    const p = row && row.payload;
    if(!p || !p.data || typeof p.data!=='object') return;
    const last = Store.get('scFrom', 0);
    if(!(p.exportedAt > last)) return; // data remote tidak lebih baru
    const hasLocal = !!Store.get('profile', null);
    if(!hasLocal || p.exportedAt > last){
      const del = new Set(Store.get('pvDel', []));
      const pv = Array.isArray(p.data.potovideo) ? p.data.potovideo.filter(m=>!del.has(m.id)) : [];
      Object.keys(p.data).forEach(k=>{ if(k==='auth'||k==='potovideo') return; localStorage.setItem(DB_PREFIX+k, JSON.stringify(p.data[k])); });
      Store.set('pvCloud', pv, true);
      Store.set('scFrom', p.exportedAt, true);
      this.online = true;
      render();

    }

  }

function dataUrlToBytes(dataUrl){
  const idx = dataUrl.indexOf(',');
  const b64 = dataUrl.slice(idx+1);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function buildCloudPayload(full){
  const up = Store.get('scUp', {}); // {studentId:{h,url}} — cache foto yang sudah di cloud
  const sts = students().map(s=>Object.assign({}, s));
  let uploaded = 0;
  for(const s of sts){
    const f = s.photo;
    if(!f || !String(f).startsWith('data:')) continue;
    const hash = await sha256(f);
    const cached = up[s.id];
    if(cached && cached.h === hash){ s.photo = cached.url; continue; }
    const path = 'students/'+s.id+'-'+hash.slice(0,10)+'.jpg';
    try{
      const res = await SC.authFetch(SC.storage(path), {
        method:'POST',
        headers:{ 'Content-Type':'image/jpeg', 'x-upsert':'true' },
        body: dataUrlToBytes(f)
      });
      if(res.ok){ const url = SC.storage(path); s.photo = url; up[s.id] = { h:hash, url }; uploaded++; }
    }catch(e){ /* foto gagal unggah → tetap dataURL di payload */ }
  }
  if(uploaded){ Store.set('scUp', up, true); }
  const pvCloud = [];
  if(full){
    const upPv = Store.get('pvUp', {}); // {id:{url,size}} — cache media galeri yang sudah di cloud
    let allPv = [];
    try{ allPv = await PvStore.getAll(); }catch(e){ allPv = []; }
    for(const r of allPv){
      if(!r || !r.id || !r.file_blob) continue;
      const cache = upPv[r.id];
      if(cache && cache.url){ pvCloud.push(pvCloudMeta(r, cache.url)); continue; }
      const ext = String(r.fileName || '').match(/\.([A-Za-z0-9]+)$/);
      const extStr = ext ? ext[1].toLowerCase() : (r.tipe_media === 'video' ? 'mp4' : 'jpg');
      const path = 'galeri/'+r.id+'-'+String(r.size)+'.'+extStr;
      try{
        const res = await SC.authFetch(SC.storage(path), {
          method:'POST',
          headers:{ 'Content-Type': (r.file_blob.type || (r.tipe_media === 'video' ? 'video/mp4' : 'image/jpeg')), 'x-upsert':'true' },
          body: r.file_blob
        });
        if(res.ok){
          const url = SC.storage(path);
          upPv[r.id] = { url, size: r.size };
          pvCloud.push(pvCloudMeta(r, url));
        }
      }catch(e){ /* media gagal unggah → tidak disertakan kali ini */ }
    }
    if(Object.keys(upPv).length) Store.set('pvUp', upPv, true);
  }
  return {
    v: 2,
    exportedAt: Date.now(),
    data: {
      profile: profile(), classes: classes(), students: sts,
      attendance: attendance(), statusConfig: statusConfig(), settings: appSettings(), teachers: teachers(),
      finance: finance(), rekening: rekening(),
      potovideo: pvCloud,
    }
  };
}

}

/* ---------------------------- Input sanitization ----------------------------
   Server-side validation MUST selalu ada; ini hanya pertahanan lapisan kedua di

   nilai dari backup/impor yang berisi "javascript:" atau "data:text/html" tidak
   bisa menjadi vektor XSS (mis. di src logo atau url() latar belakang). */
function sanitizeUrl(u){
  const s = (u==null?'':String(u)).trim();
  if(!s) return '';
  const lower = s.toLowerCase();
  if(/^(https?:|blob:)/.test(lower) && !/javascript:|vbscript:|data:text\/html/.test(lower)) return s;
  if(lower.startsWith('data:image/')) return s;
  return '';
}

function loadScript(src){

    const found = document.querySelector('script[data-lazy="'+src+'"]');

    const s = document.createElement('script');
    s.src = src; s.async = true; s.dataset.lazy = src;
    s.onload = ()=>res();
    s.onerror = ()=>rej(new Error('gagal memuat pustaka: '+src));
    document.head.appendChild(s);
  });
}

async function sha256(text){

  try{
    if(window.crypto && window.crypto.subtle && window.isSecureContext !== false){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to pure-JS implementation below */ }
  // Fallback pure-JS SHA-256 — works everywhere (file://, WebView, older Android
  // browsers, non-secure contexts) where window.crypto.subtle may be unavailable.
  return sha256Fallback(new TextEncoder().encode(text));
}
function sha256Fallback(bytes){

    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  const l = bytes.length;
  const withOne = new Uint8Array(((l+9+63)>>6)<<6);
  withOne.set(bytes);
  withOne[l] = 0x80;
  const bitLenHi = Math.floor(l*8 / 0x100000000);
  const bitLenLo = (l*8) >>> 0;
  const dv = new DataView(withOne.buffer);
  dv.setUint32(withOne.length-8, bitLenHi);
  dv.setUint32(withOne.length-4, bitLenLo);
  function rotr(x,n){ return (x>>>n)|(x<<(32-n)); }
  for(let off=0; off<withOne.length; off+=64){
    const w = new Uint32Array(64);
    for(let i=0;i<16;i++){ w[i] = dv.getUint32(off+i*4); }
    for(let i=16;i<64;i++){
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15]>>>3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1)|0;

    for(let i=0;i<64;i++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + K[i] + w[i])|0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);

      h=g; g=f; f=e; e=(d+temp1)|0; d=c; c=b; b=a; a=(temp1+temp2)|0;

/* ---------------------------- Robust file download (Android-safe) ----------------------------
   On many Android browsers, downloads triggered from a page opened directly from local
   storage (file://) can silently fail with a plain <a download> click. This helper tries
   the Web Share API first (best on Android — saves straight to Files/Drive/WhatsApp/etc via
   the native share sheet), then falls back to a normal Blob download, then to opening the
   file in a new tab as a last resort. */
async function downloadFile(blob, filename, mimeType){
  try{
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:mimeType});
      if(navigator.canShare({files:[file]})){
        // Beri batas waktu: sebagian WebView punya navigator.share yang menggantung
        // tanpa membuka UI. Bila lewat waktu, lanjut ke unduh biasa.
        await Promise.race([
          navigator.share({files:[file], title:filename}),
          new Promise((_, rej)=>setTimeout(()=>rej(new Error('share-timeout')), 3000))
        ]);
        return true;
      }
    }
  }catch(e){ /* user cancelled share, unsupported, atau timeout — fall through */ }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){
    try{
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      return true;
    }catch(e2){ return false; }
  }
}
