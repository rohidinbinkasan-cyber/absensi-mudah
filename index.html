function bindFinance(){
  const copyBtn = document.getElementById('finCopyBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', ()=>{
      const number = rekening().number;
      if(!number) return;
      const done = ()=>{ copyBtn.innerHTML = '✓ Tersalin'; setTimeout(()=>{ copyBtn.innerHTML = icon('copy')+' Salin'; }, 1500); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(number).then(done).catch(()=>{});
      } else {
        const ta = document.createElement('textarea');
        ta.value = number; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); }catch(e){}
        document.body.removeChild(ta);
      }
    });
  }
  const itemSel = document.getElementById('finItem');
  if(itemSel){
    const syncHint = ()=>{
      const it = payItem(itemSel.value);
      const amt = document.getElementById('finAmount');
      const hint = document.getElementById('finMinHint');
      if(amt) amt.placeholder = it.amount ? ('Target '+fmtRp(it.amount)+' — min cicilan '+fmtRp(it.min)) : (it.key==='infaq' ? 'Berapapun, ikhlas' : 'Isi nominal');
      if(hint){
        hint.innerHTML = it.amount
          ? `Target <b>${fmtRp(it.amount)}</b>. Boleh diangsur — minimal <b>${fmtRp(it.min)}</b> per pembayaran.`
          : (it.key==='infaq' ? `Infaq sukarela — minimal ${fmtRp(it.min)} per pembayaran.` : `Isi nominal sesuai kesepakatan (min ${fmtRp(it.min)}).`);
      }
    };
itemSel.addEventListener('change', syncHint);
    syncHint();
  }
  attachVoiceInput('finNote');
  const submit = document.getElementById('finSubmit');
  if(submit){
    submit.addEventListener('click', ()=>{
      const studentId = document.getElementById('finStudent').value;
      const itemKey = document.getElementById('finItem').value;
      const amount = Math.round(Number(document.getElementById('finAmount').value));
      const date = document.getElementById('finDate').value || todayISO();
      const note = document.getElementById('finNote').value.trim();
      if(!studentId){ showToast('Pilih santri dulu.', 'error'); return; }
      const it = payItem(itemKey);
      if(!amount || isNaN(amount) || amount < it.min){ showToast('Nominal minimal untuk '+it.label+' adalah '+fmtRp(it.min)+'.', 'error'); return; }
      App.finConfirm = {studentId, itemKey, amount, date, note};
      render();
    });
  }
  document.querySelectorAll('[data-fin-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canManageFinance()) return;
      const id = el.getAttribute('data-fin-del');
      showConfirm('Hapus catatan pembayaran ini?', ()=>{
        saveFinance(finance().filter(f=>f.id!==id));
        render();
        showToast('Catatan pembayaran dihapus.', 'info');
      }, {title:'Hapus Pembayaran', okText:'Ya, Hapus'});
    });
  });
  const clsSel = document.getElementById('finClassFilter');
  if(clsSel) clsSel.addEventListener('change', e=>{ App.finClassFilter = e.target.value; render(); });
  const itemF = document.getElementById('finItemFilter');
  if(itemF) itemF.addEventListener('change', e=>{ App.finItemFilter = e.target.value; render(); });
  const searchEl = document.getElementById('finSearch');
  if(searchEl) searchEl.addEventListener('input', debounce(e=>{
    App.finSearch = searchEl.value;
    render();
    // Pulihkan fokus & posisi kursor setelah render agar tetap bisa mengetik
    // di HP Android (render menghancurkan elemen input lama).
    const el2 = document.getElementById('finSearch');
    if(el2){
      el2.focus();
      const len = el2.value.length;
      try{ el2.setSelectionRange(len, len); }catch(err){}
    }
  }, 350));
}

/* ---------------------------- Konfirmasi pembayaran (bayar di aplikasi) ---------------------------- */
function renderFinConfirmModal(){
  const c = App.finConfirm;
  if(!c) return '';
  const s = students().find(x=>x.id===c.studentId) || {};
  const clsName = (()=>{ const cc = classes().find(x=>x.id===s.classId); return cc ? cc.name : ''; })();
  const it = payItem(c.itemKey);
  const rows = [
    ['Santri', escapeHtml(s.name||'—')],
    ['Kelas', escapeHtml(clsName||'—')],
    ['Jenis Pembayaran', escapeHtml(it.label)],
    ['Jumlah', fmtRp(c.amount)],
    ['Tanggal', fmtDateID(c.date)],
  ];
  if(c.note) rows.push(['Keterangan', escapeHtml(c.note)]);
  return `
  <div class="modal-backdrop" id="finConfirmBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${icon('wallet')} Konfirmasi Pembayaran</h3><button class="icon-btn" id="finConfirmClose">${icon('close')}</button></div>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-4px;">Periksa kembali rincian pembayaran sebelum disimpan.</p>
      <div style="background:var(--green-50); border-radius:12px; padding:12px 14px; margin-bottom:14px;">
        ${rows.map(r=>`<div style="display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid rgba(11,107,79,.12); font-size:13px;"><span style="color:var(--ink-soft);">${r[0]}</span><b style="text-align:right;">${r[1]}</b></div>`).join('')}
      </div>
      <button class="btn btn-gold btn-block" id="finConfirmOk">${icon('check')} Konfirmasi &amp; Simpan Pembayaran</button>
      <button class="btn btn-outline btn-block" id="finConfirmCancel" style="margin-top:8px;">Batal</button>
    </div>
  </div>`;
}
function bindFinConfirm(){
  const backdrop = document.getElementById('finConfirmBackdrop');
  if(!backdrop) return;
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop){ App.finConfirm=null; render(); } });
  const close = document.getElementById('finConfirmClose');
  if(close) close.addEventListener('click', ()=>{ App.finConfirm=null; render(); });
  const cancel = document.getElementById('finConfirmCancel');
  if(cancel) cancel.addEventListener('click', ()=>{ App.finConfirm=null; render(); });
  const ok = document.getElementById('finConfirmOk');
  if(ok) ok.addEventListener('click', ()=>{
    const c = App.finConfirm;
    if(!c) return;
    const list = finance();
    list.push({id:uid(), date:c.date, studentId:c.studentId, item:c.itemKey, amount:c.amount, note:c.note, by: roleLabel(), createdAt: Date.now()});
    saveFinance(list);
    App.finConfirm = null;
    render();
  });
}

        showPrompt('Kata sandi baru (minimal 4 karakter):', '', async np=>{
          if(np===null || np===undefined) return;

          let serverOk = false;
          if(apiAvailable()){
            try{
              await API.req('/api/auth/change-password', {method:'POST', body:JSON.stringify({currentPassword:cur, newPassword:np})});

            }catch(e){
              if(e.status && e.status !== 0){ showToast('Server menolak kata sandi saat ini — perubahan hanya disimpan di perangkat ini.', 'warn'); }

          a.passHash = await sha256(np);

          showToast(serverOk ? 'Kata sandi diubah (server + perangkat ini).' : 'Kata sandi disimpan di perangkat ini.', serverOk ? 'success' : 'info');

async function exportBackup(){
  const btn = document.getElementById('exportBtn');
  const original = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = 'Memproses...'; }
  try{
    const data = {
      profile: profile(), classes: classes(), students: students(),
      attendance: attendance(), statusConfig: statusConfig(), settings: appSettings(), teachers: teachers(),
      finance: finance(), rekening: rekening(),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const ok = await downloadFile(blob, 'backup-absensi-'+todayISO()+'.json', 'application/json');
    if(!ok) showToast('Gagal mengunduh file backup. Pastikan menggunakan browser Chrome terbaru.', 'error');
  }catch(e){
    showToast('Gagal membuat file backup.', 'error');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = original; }
  }
}

const submit = async ()=>{
    if(isPublicSite()){ showToast('Login hanya tersedia dari server madrasah (jaringan lokal).', 'warn'); return; }
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const hash = await sha256(pass);
const errEl = document.getElementById('loginError');
    const fail = (msg)=>{ errEl.style.display='block'; if(msg) errEl.textContent = msg; };
    if(App.loginMode==='guru'){
      // Guru: coba backend dulu (JWT). 401 = kredensial salah; offline -> fallback lokal.
      let rejected = false, serverMsg = '';

      }catch(e){
        if(e.status && e.status !== 0 && e.status !== 404){ rejected = true; serverMsg = (e && e.message) || ''; }
      }
      if(!rejected && apiAvailable()){
        sessionStorage.setItem('mda_session', JSON.stringify({role:'guru'}));
        App.loginOpen=false;
        await Sync.pull();
        render();
        return;
      }
      const t = teachers().find(x=>x.username===user);
      if(t && t.passHash===hash){
        sessionStorage.setItem('mda_session', JSON.stringify({role:'guru', id:t.id}));
        App.loginOpen=false;
        render();
        return;
      }
      fail(serverMsg || undefined); return;
    }
    // Admin: coba backend dulu (JWT). Bila server merespons 'tidak sah' (401)
    // berarti kredensial salah -> tampilkan error. Bila offline (status 0) ->
    // fallback ke akun admin lokal.
    let rejected = false, serverMsg = '';
    try{
      const u = await apiLogin(user, pass);
      if(u.role!=='admin') rejected = true;
    }catch(e){
      if(e.status && e.status !== 0 && e.status !== 404){ rejected = true; serverMsg = (e && e.message) || ''; }
    }
    if(!rejected && apiAvailable()){
      sessionStorage.setItem('mda_session', JSON.stringify({role:'admin'}));
      App.loginOpen=false;
      App.loginBtnLoading = true;
      await Sync.pull();      // tarik data remote lalu gabung lokal
      Sync.pushAll();         // unggah data lokal yang belum ada di server
      App.loginBtnLoading = false;
      render();
      return;
    }
    // Fallback lokal (offline / tidak ada server)
    const a = auth();
    if(a && a.username===user && a.passHash===hash){
      sessionStorage.setItem('mda_session', JSON.stringify({role:'admin'}));
App.loginOpen=false;
      render();
      return;
    }
    fail(serverMsg || undefined);
  };
  btn.addEventListener('click', submit);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  const pwdToggle = document.getElementById('loginPassToggle');
  if(pwdToggle) pwdToggle.addEventListener('click', ()=>{
    const inp = document.getElementById('loginPass');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    pwdToggle.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    pwdToggle.innerHTML = icon(show ? 'eyeoff' : 'eye');
    inp.focus();
  });
}

/* ---------------------------- Android "app-like" manifest ----------------------------
   Generated on the fly (no separate manifest.json file needed) so that when the user
   taps "Add to Home screen" / "Install app" on Android Chrome, the shortcut opens in
   standalone mode (no address bar) with a proper name, icon and theme color. */
(function setupManifest(){
  try{
    const iconSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B6B4F'/%3E%3Ccircle cx='57' cy='44' r='25' fill='%23E8C766'/%3E%3Ccircle cx='46' cy='39' r='23' fill='%230B6B4F'/%3E%3C/svg%3E";
    const manifest = {
      name: "Absensi Digital Madrasah",
      short_name: "Absensi Madrasah",
      start_url: location.href,
      display: "standalone",
      background_color: "#FFFFFF",
      theme_color: "#0B6B4F",
      orientation: "portrait",
      icons: [
        {src: iconSvg, sizes: "192x192", type: "image/svg+xml"},
        {src: iconSvg, sizes: "512x512", type: "image/svg+xml"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){ /* non-critical — app still works without a manifest */ }
})();

function applyEmbeddedData(){
  const ed = window.__EMBEDDED_DATA__;

  try{

    const hasLocal = !!Store.get('profile', null);
    // Terapkan bila perangkat masih kosong ATAU data di file lebih baru dari yang pernah diterapkan
    if(!hasLocal || ed.exportedAt > lastSync){
      Object.keys(ed.data).forEach(k=>{ if(k!=='auth') localStorage.setItem(DB_PREFIX+k, JSON.stringify(ed.data[k])); });
      Store.set('syncFrom', ed.exportedAt, true);

/* =========================================================================
   VIEW: POTO & VIDEO KEGIATAN (pengganti "Dokumentasi")
   • Media binary (Blob) + metadata (id, tipe_media, kelas, judul, tanggal)
     disimpan sebagai SATU record di IndexedDB (mda_potovideo) — jangan pakai
     localStorage untuk foto/video karena kuotanya kecil ("quota exceeded").
   • Wali santri / publik (role tamu, tanpa login): READ-ONLY — form upload &
     tombol hapus disembunyikan. Admin/Guru yang sudah masuk: bisa upload
     (form poto & video terpisah) serta menghapus media.
   • Data lama dari DB mda_dokumentasi + metadata localStorage (dokMeta)
     dipindahkan otomatis SEKALI SAJA (flag pvMigrated) supaya tidak hilang.
   • Semua berjalan offline 100% (tidak butuh internet).
   ========================================================================= */
const PV_DB_NAME = 'mda_potovideo';
const PV_STORE = 'media';
const PvStore = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject)=>{
      try{
        if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung browser ini')); return; }
        const req = indexedDB.open(PV_DB_NAME, 1);
        req.onupgradeneeded = ()=>{
          const db = req.result;
          if(!db.objectStoreNames.contains(PV_STORE)) db.createObjectStore(PV_STORE, {keyPath:'id'});
        };
        req.onsuccess = ()=>{ this._db = req.result; resolve(this._db); };
        req.onerror = ()=>reject(req.error || new Error('Gagal membuka penyimpanan media'));
      }catch(e){ reject(e); }
    });
  },
  put(rec){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(PV_STORE, 'readwrite');
      tx.objectStore(PV_STORE).put(rec);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error || new Error('Gagal menulis media'));
    }));
  },
  get(id){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(PV_STORE, 'readonly');
      const rq = tx.objectStore(PV_STORE).get(id);
      rq.onsuccess = ()=>resolve(rq.result || null);
      rq.onerror = ()=>reject(rq.error);
    }));
  },
  getAll(){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(PV_STORE, 'readonly');
      const rq = tx.objectStore(PV_STORE).getAll();
      rq.onsuccess = ()=>resolve(rq.result || []);
      rq.onerror = ()=>reject(rq.error);
    }));
  },
  remove(id){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(PV_STORE, 'readwrite');
      tx.objectStore(PV_STORE).delete(id);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error || new Error('Gagal menghapus media'));
    }));
  }
};

/* ---------- penyimpanan lama (mda_dokumentasi) — dibaca utk migrasi sekali pakai ---------- */
const LEGACY_DB_NAME = 'mda_dokumentasi';
const LegacyDocStore = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject)=>{
      try{
        if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung')); return; }
        const req = indexedDB.open(LEGACY_DB_NAME, 1);
        req.onsuccess = ()=>{ this._db = req.result; resolve(this._db); };
        req.onerror = ()=>reject(req.error);
      }catch(e){ reject(e); }
    });
  },
  get(id){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction('media', 'readonly');
      const rq = tx.objectStore('media').get(id);
      rq.onsuccess = ()=>resolve(rq.result || null);
      rq.onerror = ()=>reject(rq.error);
    })).catch(()=>null);
  }
};
let __pvMigrated = false;
async function pvMigrateLegacy(){
  if(__pvMigrated || Store.get('pvMigrated', false)) return;
  __pvMigrated = true;
  try{
    const oldMeta = Store.get('dokMeta', []);
    if(!Array.isArray(oldMeta) || !oldMeta.length){ Store.set('pvMigrated', true, true); return; }
    const existing = await PvStore.getAll();
    const have = new Set(existing.map(r=>r.id));
    let n = 0;
    for(const m of oldMeta){
      if(!m || !m.id || have.has(m.id)) continue;
      const rec = await LegacyDocStore.get(m.id);
      if(!rec || !rec.blob) continue;
      try{
        await PvStore.put({
          id: m.id,
          tipe_media: m.type === 'video' ? 'video' : 'poto',
          kelas: m.kelas || '',
          judul: m.title || '',
          tanggal: m.date || todayISO(),
          file_blob: rec.blob,
          createdAt: m.createdAt || Date.now(),
          fileName: rec.blob.name || '',
          size: rec.blob.size || 0
        });
        n++;
      }catch(e){}
    }
    if(n) showToast(n + ' media lama dipindahkan ke Poto & Video.', 'success');
    Store.set('pvMigrated', true, true);
  }catch(e){ /* migrasi best-effort — gagal pun aplikasi tetap berjalan */ }
}

function fmtFileSize(bytes){
  if(bytes == null || isNaN(bytes)) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' MB';
  return (bytes/(1024*1024*1024)).toFixed(2) + ' GB';
}

/* ---------- simpan upload (ke server/galeri bersama, fallback lokal) ---------- */
async function pvSaveUpload(tipe){
  if(!pvIsManager()) return;
  const p = tipe === 'video' ? 'pvVideo' : 'pvFoto';
  const files = (document.getElementById(p+'Files')||{}).files;
  if(!files || !files.length){ showToast('Pilih file ' + (tipe==='video'?'video':'poto') + ' terlebih dahulu.', 'warn'); return; }
  const kelas = ((document.getElementById(p+'Kelas')||{}).value || '').trim();
  const tanggal = ((document.getElementById(p+'Tanggal')||{}).value || '').trim() || todayISO();
  const judul = ((document.getElementById(p+'Judul')||{}).value || '').trim();
  const btn = document.getElementById(p+'Save');
  if(btn){ btn.disabled = true; btn.innerHTML = 'Menyimpan…'; }
  let ok = 0, failed = 0, savedLocal = 0;
  const toServer = apiAvailable();
  for(const f of files){
    try{
      if(toServer){ await uploadServerFile(f, judul, kelas, tanggal); ok++; }
      else throw new Error('offline');
    }catch(e){
      try{
        await PvStore.put({
          id: uid(), tipe_media: tipe, kelas, judul, tanggal,
          file_blob: f, createdAt: Date.now(), fileName: f.name || '', size: f.size || 0
        });
        ok++; savedLocal++;
      }catch(e2){ failed++; }
    }
  }
  if(ok){
    [p+'Files', p+'Judul'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
    showToast(ok + ' ' + (tipe==='video'?'video':'poto') + (savedLocal ? ' tersimpan lokal (server tidak aktif).' : ' tersimpan ke galeri bersama.'), 'success');
    loadPvGallery();
  }
  if(failed) showToast(failed + ' file gagal disimpan.', 'error');
  if(btn){ btn.disabled = false; btn.innerHTML = icon('check') + ' Simpan'; }
}
async function uploadServerFile(f, judul, kelas, tanggal){
  const ft = String(f.type || '');
  if(!ft.startsWith('image/') && !ft.startsWith('video/')) throw new Error('Hanya foto/video');
  const res = await fetch(API.base + '/api/files', {
    method:'POST',
    headers:{
      'Content-Type':'application/octet-stream',
      'Authorization':'Bearer '+API.token(),
      'X-Filename': encodeURIComponent(f.name || ''),
      'X-Mime': ft,
      'X-Judul': encodeURIComponent(judul || ''),
      'X-Kelas': encodeURIComponent(kelas || ''),
      'X-Tanggal': encodeURIComponent(tanggal || '')
    },
    body: f
  });
  if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || ('Kesalahan server ('+res.status+')')); }
  return true;
}

/* ---------- galeri ---------- */
async function loadPvGallery(){
  const tab = App.pvTab === 'video' ? 'video' : 'poto';
  const wrap = document.getElementById('pvGallery');
  if(!wrap) return;
  await pvMigrateLegacy();
  const filter = App.pvClassFilter || '';
  wrap.innerHTML = '<div class="doc-loading"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>';
  let all = [];
  try{ all = await PvStore.getAll(); }catch(e){ all = []; }
  pvRevokeUrls();
  const local = all
    .filter(r => r.tipe_media === tab)
    .filter(r => !filter || r.kelas === filter)
    .map(r=>Object.assign({}, r, { url: URL.createObjectURL(r.file_blob), cloud:false }));
  local.forEach(it=>pvTrackUrl(it.url));
  const cloudRaw = Array.isArray(Store.get('pvCloud', [])) ? Store.get('pvCloud', []) : [];
  const cloud = cloudRaw
    .filter(r => r.tipe_media === tab)
    .filter(r => !filter || r.kelas === filter)
    .map(r=>Object.assign({}, r, { cloud:true }));
  const server = await loadServerFiles(tab);
  const items = local.concat(cloud).concat(server).sort((a,b)=>itemTime(b)-itemTime(a));
  if(!items.length){
    wrap.innerHTML = `<div class="empty">${icon(tab==='video'?'film':'photo')}<b>Belum ada ${tab==='video'?'video':'poto'}</b>${filter ? ' untuk kelas ini' : ''}${pvIsManager() ? ' — gunakan formulir upload di atas.' : ''}</div>`;
    return;
  }
  wrap.innerHTML = renderPvGallery(tab, items);
  bindPvGallery();
}
async function loadServerFiles(tab){
  const isVid = tab === 'video';
  let files = [];
  try{ files = await galReq('/api/gallery/list?type=' + (isVid?'video':'poto')); }
  catch(e){
    try{ files = (await API.req('/api/files')).filter(r => String(r.source || 'local') !== 'cloud'); }
    catch(e2){ return []; }
  }
  if(!Array.isArray(files)) return [];
  return files
    .filter(r => String(r.mime||'').startsWith(isVid ? 'video/' : 'image/'))
    .map(serverMeta);
}
function serverMeta(r){
  const isBlob = String(r.pathname||'').indexOf('galeri/') === 0;
  return {
    id: isBlob ? 'bv' + r.pathname : 'sv' + r.id,
    tipe_media: String(r.mime||'').startsWith('video/') ? 'video' : 'poto',
    judul: r.judul || r.filename || 'Tanpa judul',
    kelas: r.kelas || '',
    tanggal: r.tanggal || String(r.created_at||'').slice(0,10),
    createdAt: r.uploadedAt ? new Date(r.uploadedAt).getTime() : itemTime(r),
    url: isBlob ? r.url : (API.base + r.url),
    cloud: true,
    server: true,
    serverId: isBlob ? r.pathname : r.id,
    uploader_name: r.uploader_name || '',
  };
}
function itemTime(m){
  if(typeof m.createdAt === 'number') return m.createdAt;
  const s = String(m.created_at || '');
  if(!s) return 0;
  return new Date(s.replace(' ', 'T') + 'Z').getTime() || 0;
}

  PvStore.get(id).then(m=>{

/* =========================================================================
   ✦ SLIDESHOW FOTO DASHBOARD + INDIKATOR NAV EMAS — blok ADITIF
   • SlideShow: foto base64 JPEG terkompresi di localStorage (mda_slides).
     Area otomatis disembunyikan bila kosong; timer 3 detik berjalan HANYA
     saat Dashboard tampil (self-guard: berhenti sendiri bila elemen hilang,
     view bukan dashboard, atau tab browser tersembunyi).
   • Foto TIDAK pernah ter-crop: lapisan depan object-fit:contain + latar
     blur dari foto sama (letterbox ala Instagram Story). Tinggi kontainer
     adaptif via slideFitHeight() mengikuti rasio foto aktif; disesuaikan
     ulang otomatis saat resize/orientationchange.
   • NavIndicator: bilah emas persisten di #uiLayer yang bergeser mulus
     (transform-only) ke tab aktif — selamat dari render() yang mengganti
     isi #root, karena elemennya di luar #root.
   ========================================================================= */
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / (img.width || 1));
      const w = Math.max(1, Math.round((img.width || 1) * scale));
      const h = Math.max(1, Math.round((img.height || 1) * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL('image/jpeg', quality)); }catch(e){ reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('file tidak bisa dibaca sebagai gambar')); };
    img.src = url;
  });
}

const SlideShow = {

/* Tinggi kontainer adaptif mengikuti rasio foto aktif (tidak pernah crop).
   - h = lebar / rasio foto, dikurung antara minH (clamp adaptif) dan
     maxH = min(60dvh|60vh, 420px). Nilai dvh dipakai saat browser
     mendukungnya (Android Chrome modern), fallback vh untuk WebView lama.
   - Dipanggil ulang saat slide berubah, gambar selesai dimuat, resize,
     dan orientationchange — foto selalu tampil utuh. */
function slideFitHeight(){
  const track = document.getElementById('slideTrack');
  if(!track) return;
  const fg = track.querySelector('.slide-frame.on .slide-fg') || track.querySelector('.slide-fg');
  if(!fg) return;
  const wrap = document.getElementById('dashSlideshow') || track;
  const w = wrap.getBoundingClientRect().width || track.getBoundingClientRect().width || 320;
  const natW = fg.naturalWidth || 4;
  const natH = fg.naturalHeight || Math.round(w * 0.75);
  const ratio = natH / natW;
  const maxH = Math.round(Math.min(window.innerHeight * 0.6, 420));
  const minH = Math.max(110, Math.min(200, Math.round(window.innerWidth * 0.24)));
  const h = Math.max(minH, Math.min(Math.round(w * ratio), maxH));
  if(Math.abs(h - track.clientHeight) > 2) track.style.height = h + 'px';
}

function bindSlideshow(){
  const track = document.getElementById('slideTrack');
  if(track){
    SlideShow.idx = 0;
    SlideShow.apply();
    SlideShow.start();
    track.querySelectorAll('.slide-fg').forEach(im=>{
      im.addEventListener('load', ()=>{ if(App.view === 'dashboard') slideFitHeight(); });
    });
  }
  if(!window.__mdaSlideResizeBound){
    window.__mdaSlideResizeBound = true;
    const onResize = debounce(()=>{ if(App.view === 'dashboard') slideFitHeight(); }, 120);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
  }
  document.querySelectorAll('#slideDots .slide-dot').forEach(d=>{
    d.addEventListener('click', ()=>{ SlideShow.go(parseInt(d.getAttribute('data-slide-go'), 10) || 0); });
  });
const mgmtBtn = document.getElementById('slideMgmtBtn');
  if(mgmtBtn) mgmtBtn.addEventListener('click', ()=>{ SlideShow.adminOpen = !SlideShow.adminOpen; render(); });
  attachVoiceInput('slideCaption');
  const addBtn = document.getElementById('slideAddBtn');
  if(addBtn) addBtn.addEventListener('click', slideAddPhotos);
  const list = document.getElementById('slideList');
  if(list) list.addEventListener('click', e=>{
    const del = e.target.closest('[data-slide-del]');
    if(!del) return;
    const id = del.getAttribute('data-slide-del');
    showConfirm('Hapus foto slideshow ini?', ()=>{
      SlideShow.save(SlideShow.photos().filter(p=>p.id !== id));
      render();
      showToast('Foto slideshow dihapus.', 'info');
    }, { title:'Hapus Foto', okText:'Ya, Hapus' });
  });
}
async function slideAddPhotos(){
  const filesEl = document.getElementById('slideFiles');
  const files = filesEl ? filesEl.files : null;
  if(!files || !files.length){ showToast('Pilih foto dulu.', 'warn'); return; }
  const caption = ((document.getElementById('slideCaption') || {}).value || '').trim();
  const btn = document.getElementById('slideAddBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Memproses…'; }
  let ok = 0, fail = 0, full = false;
  const photos = SlideShow.photos();
  for(const f of files){
    if(!f.type || !f.type.startsWith('image/')){ fail++; continue; }
    try{
      const data = await compressImage(f, 960, 0.72);
      const total = photos.reduce((s,p)=>s + (p.data || '').length, 0) + data.length;
      if(total > 4200000){ full = true; break; }
      photos.push({ id: uid(), data, caption });
      ok++;
    }catch(e){ fail++; }
  }
  if(ok){ SlideShow.save(photos); SlideShow.adminOpen = true; render(); showToast(ok + ' foto ditambahkan ke slideshow.', 'success'); }
  if(fail) showToast(fail + ' file tidak bisa diproses (harus gambar).', 'error');
  if(full) showToast('Penyimpanan hampir penuh — hapus beberapa foto slideshow dulu.', 'error');
  if(btn){ btn.disabled = false; btn.innerHTML = icon('plus') + ' Tambah ke Slideshow'; }
}

const NavIndicator = {

    if(!active || !nav){ el.classList.remove('show'); return; }

      el.style.borderRadius = '0 4px 4px 0';

    } else {

      el.style.width = barW + 'px';

      el.style.borderRadius = '0 0 4px 4px';
      el.style.transform = `translate3d(${Math.round(r.left + r.width/2 - barW/2)}px, ${Math.round(nr.top)}px, 0)`;

/* =========================================================================
   PEMUTAR MUSIK LATAR (background music) — blok ADITIF
   • File MP3 disimpan sebagai Blob di IndexedDB (mda_musik) agar persisten di
     perangkat & bisa diputar 100% offline. Metadata ringan di localStorage.
   • Autoplay browser modern diblokir tanpa interaksi user → fallback cerdas:
     musik mulai memutar otomatis pada sentuhan/klik pertama user di mana saja.
   • Lagu "default/sistem" berupa melodi lembut yang disintesis via Web Audio
     (tanpa file) sehingga tetap berbunyi saat aplikasi dibuka walau playlist
     masih kosong. Ketika MP3 diunggah, playlist mengambil alih pemutaran.
   • Widget melayang dipasang di #uiLayer (di luar #root) → tetap hidup saat
     render() mengganti isi root, tidak mengganggu fungsi-fungsi lain.
   ========================================================================= */
const MUSIK_DB = 'mda_musik';
const MusikDB = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject)=>{
      try{
        if(!window.indexedDB){ reject(new Error('IndexedDB tidak tersedia')); return; }
        const req = indexedDB.open(MUSIK_DB, 1);
        req.onupgradeneeded = ()=>{
          const db = req.result;
          if(!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', {keyPath:'id'});
        };
        req.onsuccess = ()=>{ this._db = req.result; resolve(this._db); };
        req.onerror = ()=>reject(req.error || new Error('Gagal membuka penyimpanan musik'));
      }catch(e){ reject(e); }
    });
  },
  put(rec){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(rec);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error || new Error('Gagal menyimpan lagu'));
    }));
  },
  get(id){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction('tracks', 'readonly');
      const rq = tx.objectStore('tracks').get(id);
      rq.onsuccess = ()=>resolve(rq.result || null);
      rq.onerror = ()=>reject(rq.error);
    }));
  },
  remove(id){
    return this.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').delete(id);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    }));
  }
};
function musikMeta(){ return Store.get('musik_meta', []); }
function saveMusikMeta(list){ Store.set('musik_meta', list, true); }
function musikSettings(){ return Store.get('musik_settings', {shuffle:false, loop:false, muted:false, volume:0.6, currentId:null}); }
function saveMusikSettings(s){ Store.set('musik_settings', s, true); }

const Music = {
  list: [],        // metadata playlist (dari localStorage)
  order: [],       // urutan putar (ikut mode shuffle)
  idx: -1,
  currentId: null,
  playing: false,
  started: false,  // pernah benar-benar mulai berbunyi (autoplay sukses / gestur user)
  settings: null,
  audio: null,
  toneCtx: null,
  toneGain: null,
  toneLoop: false,  // benar-benar sedang berbunyi (loop terjadwal), bukan sekadar context dibuat
  toneTimer: null,
  _init: false,
  defaultName: 'Melodi Madin (Nada Default)'
};
const svgPlay = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;stroke:none;display:block;"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
const svgPause = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;stroke:none;display:block;"><rect x="6" y="4" width="4.5" height="16" rx="1.4"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.4"/></svg>';

/* ---------- inisialisasi & pemuatan state ---------- */
function musicInit(){
  if(Music._init) return;
  Music._init = true;
  Music.settings = musikSettings();
  Music.list = musikMeta().slice();
  if(Music.list.length){
    Music.currentId = Music.list.some(t=>t.id===Music.settings.currentId) ? Music.settings.currentId : Music.list[0].id;
  } else {
    Music.currentId = null;
  }
  musicRebuildOrder();
  musicBuildAudio();
  musicWidgetEl();
  musicSync();
}
function musicRebuildOrder(){
  if(Music.settings.shuffle){
    Music.order = Music.list.map(t=>t.id).slice();
    for(let i=Music.order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = Music.order[i]; Music.order[i] = Music.order[j]; Music.order[j] = tmp;
    }
  } else {
    Music.order = Music.list.map(t=>t.id);
  }
  Music.idx = Music.currentId ? Music.order.indexOf(Music.currentId) : -1;
}
function musicBuildAudio(){
  if(Music.audio) return;
  Music.audio = new Audio();
  Music.audio.preload = 'auto';
  Music.audio.loop = !!Music.settings.loop;
  Music.audio.muted = !!Music.settings.muted;
  Music.audio.volume = Music.settings.volume || 0.6;
  Music.audio.addEventListener('ended', musicOnEnded);
}
function musicCurrentName(){
  if(Music.list.length && Music.currentId){
    const t = Music.list.find(x=>x.id===Music.currentId);
    if(t) return t.name;
  }
  return Music.defaultName;
}

/* ---------- pemutaran MP3 (elemen <audio>, blob dari IndexedDB) ---------- */
function musicPlay(notifyFail){
  musicInit();
  const list = Music.list;
  if(list.length){
    if(!Music.currentId || !list.some(t=>t.id===Music.currentId)){
      Music.currentId = list[0].id;
      Music.idx = Music.order.indexOf(Music.currentId);
    }
    musicPlayCurrent(notifyFail);
  } else {
    musicStartTone(notifyFail);
  }
}
async function musicPlayCurrent(notifyFail){
  const list = Music.list;
  if(!list.length){ musicStartTone(notifyFail); return; }
  const id = Music.currentId;
  const meta = list.find(t=>t.id===id);
  if(!meta) return;
  if(Music.audio.src && Music.audio.dataset.trackId === id && !Music.audio.paused){
    Music.playing = true; Music.started = true; musicSync(); return;
  }
  if(Music.audio.src){ try{ URL.revokeObjectURL(Music.audio.src); }catch(e){} Music.audio.removeAttribute('src'); Music.audio.load(); }
  let rec = null;
  try{ rec = await MusikDB.get(id); }catch(e){ rec = null; }
  if(!rec || !rec.blob){ showToast('File lagu tidak ditemukan di penyimpanan.', 'error'); return; }
  const url = URL.createObjectURL(rec.blob);
  Music.audio.dataset.trackId = id;
  Music.audio.src = url;
  Music.audio.loop = !!Music.settings.loop;
  Music.audio.muted = !!Music.settings.muted;
  Music.audio.volume = Music.settings.volume || 0.6;
  Music.settings.currentId = id;
  saveMusikSettings(Music.settings);
  musicStopTone();
  Music.playing = true;
  musicSync();
  const p = Music.audio.play();
  if(p && p.then){
    p.then(()=>{ Music.started = true; }).catch((err)=>{
      Music.playing = false; musicSync(); musicBindTapStart();
      if(notifyFail) showToast('Lagu diblokir browser (' + ((err && err.name) || 'autoplay') + '). Sentuh layar lalu tekan Play.', 'warn');
    });
  }
}
function musicOnEnded(){
  if(!Music.list.length) return;
  if(Music.settings.loop){ musicPlayCurrent(); return; }
  musicNext();
}
function musicNext(){
  if(!Music.list.length){ musicStartTone(); return; }
  if(!Music.order.length) musicRebuildOrder();
  if(Music.settings.shuffle && Music.order.length > 1){
    let n; do{ n = Math.floor(Math.random()*Music.order.length); }while(n === Music.idx);
    Music.idx = n;
  } else {
    Music.idx = (Music.idx + 1) % Math.max(1, Music.order.length);
  }
  if(Music.idx < 0) Music.idx = 0;
  if(Music.order[Music.idx]) Music.currentId = Music.order[Music.idx];
  musicPlayCurrent();
}
function musicPrev(){
  if(!Music.list.length){ musicStartTone(); return; }
  if(!Music.order.length) musicRebuildOrder();
  Music.idx = ((Music.idx - 1) + Math.max(1, Music.order.length)) % Math.max(1, Music.order.length);
  if(Music.idx < 0) Music.idx = 0;
  if(Music.order[Music.idx]) Music.currentId = Music.order[Music.idx];
  musicPlayCurrent();
}

/* ---------- lagu default (melodi lembut via Web Audio, tanpa file) ---------- */
function musicStartTone(notifyFail){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ Music.playing = false; musicSync(); return; }
    if(Music.toneLoop) return; // benar-benar sudah berbunyi → jangan dobel
    if(!Music.toneCtx){ Music.toneCtx = new AC(); }
    const ctx = Music.toneCtx;
    if(!Music.toneGain){
      const master = ctx.createGain();
      master.gain.value = Music.settings.muted ? 0 : (Music.settings.volume||0.6)*0.6;
      master.connect(ctx.destination);
      Music.toneGain = master;
    }
    Music.playing = true;
    Music.currentId = null;
    Music.settings.currentId = null;
    saveMusikSettings(Music.settings);
    musicSync();
    const resume = ctx.resume ? ctx.resume() : Promise.resolve();
    if(resume && resume.then){
      resume.then(()=>{ musicToneLoop(); Music.started = true; }).catch((err)=>{
        musicStopTone();
        Music.playing = false;
        musicSync();
        musicBindTapStart();
        if(notifyFail){
          const why = (err && err.name) || 'autoplay diblokir';
          showToast('Browser memblokir audio (' + why + '). Sentuh layar lalu tekan Play.', 'warn');
        }
      });
    } else {
      musicToneLoop();
      Music.started = true;
    }
  }catch(e){
    Music.playing = false;
    musicSync();
    if(notifyFail) showToast('Gagal memulai audio (' + (e && e.message || e) + ').', 'warn');
  }
}
function musicToneLoop(){
  const ctx = Music.toneCtx;
  if(!ctx || !Music.toneGain || Music.toneLoop) return;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
  const step = 0.45;
  const playNote = (freq, t, dur)=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.65, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(Music.toneGain);
    o.start(t); o.stop(t+dur+0.03);
  };
  const loop = ()=>{
    if(!Music.toneGain) return; // lagu dihentikan
    const t0 = ctx.currentTime + 0.05;
    for(let i=0;i<notes.length;i++) playNote(notes[i], t0+i*step, Math.min(0.34, step*0.9));
    Music.toneTimer = setTimeout(loop, Math.max(50, (t0 + notes.length*step - ctx.currentTime)*1000));
  };
  Music.toneLoop = true;
  loop();
}
function musicStopTone(){
  if(Music.toneTimer){ clearTimeout(Music.toneTimer); Music.toneTimer = null; }
  Music.toneLoop = false;
  if(Music.toneGain){ try{ Music.toneGain.disconnect(); }catch(e){} Music.toneGain = null; }
}
/* CATATAN ANDROID: jangan menutup (close) lalu membuat ulang AudioContext.
   Di Chrome Android, pola close()+recreate bisa membuat context baru tetap
   'suspended' selamanya → tanpa suara. Solusinya: pakai context yang sama dan
   panggil resume() lagi di dalam gestur user. */
function musicResetForGesture(){
  if(Music.toneLoop) return; // sedang berbunyi — jangan ganggu
  if(Music.toneCtx && Music.toneCtx.state === 'suspended' && Music.toneCtx.resume){
    try{ Music.toneCtx.resume(); }catch(e){}
  }
}

/* ---------- kontrol: play/pause, mute, volume, shuffle, loop ---------- */
function musicToggle(){
  musicInit();
  if(Music.list.length){
    if(Music.audio.src){
      if(Music.audio.paused){ musicPlayCurrent(true); }
      else { Music.audio.pause(); }
    } else {
      musicPlayCurrent(true);
    }
  } else {
    musicResetForGesture();
    if(Music.toneLoop){ musicStopTone(); Music.playing = false; musicSync(); }
    else { musicStartTone(true); }
  }
}
function musicToggleMute(){
  const s = Music.settings;
  s.muted = !s.muted;
  if(Music.audio) Music.audio.muted = s.muted;
  if(Music.toneGain) Music.toneGain.gain.value = s.muted ? 0 : (s.volume||0.6)*0.6;
  saveMusikSettings(s);
  musicSync();
  renderMusicList();
}
function musicSetVolume(v){
  v = Math.max(0, Math.min(1, Number(v)||0));
  Music.settings.volume = v;
  if(Music.audio) Music.audio.volume = v;
  if(Music.toneGain) Music.toneGain.gain.value = Music.settings.muted ? 0 : v*0.6;
  saveMusikSettings(Music.settings);
}
function musicToggleShuffle(){
  Music.settings.shuffle = !Music.settings.shuffle;
  saveMusikSettings(Music.settings);
  musicRebuildOrder();
  musicRefresh();
  renderMusicList();
}
function musicToggleLoop(){
  Music.settings.loop = !Music.settings.loop;
  if(Music.audio) Music.audio.loop = Music.settings.loop;
  saveMusikSettings(Music.settings);
  musicRefresh();
  renderMusicList();
}

/* ---------- autoplay + fallback sentuhan pertama ---------- */
let __musicTapBound = false;
let __musicHintShown = false;
function musicBindTapStart(){
  if(__musicTapBound) return;
  __musicTapBound = true;
  if(!__musicHintShown){
    __musicHintShown = true;
    setTimeout(()=>{
      if(!Music.started && !Music.toneLoop){
        showToast('Browser memblokir autoplay. Sentuh layar sekali untuk memulai musik.', 'info');
      }
    }, 1600);
  }
  const start = (e)=>{
    document.removeEventListener('touchend', start);
    document.removeEventListener('click', start);
    __musicTapBound = false;
    // Bila sentuhan pertama justru terjadi pada widget itu sendiri, biarkan
    // tombol widget menanganinya (mis. Play = mulai, tanpa autostart ganda yang
    // membuat tombol tampak "mati" karena langsung dipause oleh handler click).
    const w = document.getElementById('musicWidget');
    if(w && e && e.target && w.contains(e.target)) return;
    musicResetForGesture(); // context audio yang sama, resume() ulang di dalam gestur
    musicPlay(true); // dimulai dari gestur user (touchend/click dijamin gesture di iOS & Android)
  };
  document.addEventListener('touchend', start, {passive:true});
  document.addEventListener('click', start);
}
function musicBoot(){
  musicInit();
  musicPlay(); // coba autoplay langsung (MP3 terakhir / melodi default)
  setTimeout(()=>{ if(!Music.started) musicBindTapStart(); }, 900); // amankan bila diblokir
}

/* ---------- widget melayang ---------- */
function musicWidgetEl(){
  let w = document.getElementById('musicWidget');
  if(!w){
    w = document.createElement('div');
    w.id = 'musicWidget';
    w.className = 'music-widget';
    w.innerHTML =
      '<button class="mw-btn" id="mwPlayBtn" aria-label="Putar / Jeda">' + svgPlay + '</button>' +
      '<div class="mw-info">' +
        '<div class="mw-title paused" id="mwTitle"><span class="mw-track">Memuat…</span></div>' +
        '<div class="mw-status" id="mwStatus"></div>' +
      '</div>' +
      '<button class="mw-btn ghost" id="mwMuteBtn" aria-label="Bisukan / Nyaringkan">' + icon('volon') + '</button>' +
      '<button class="mw-btn ghost" id="mwListBtn" aria-label="Buka Pengaturan Musik / Playlist">' + icon('list') + '</button>';
    uiLayer().appendChild(w);
    w.addEventListener('click', e=>{
      const b = e.target.closest('button');
      if(!b) return;
      if(b.id === 'mwPlayBtn') musicToggle();
      else if(b.id === 'mwMuteBtn') musicToggleMute();
      else if(b.id === 'mwListBtn') musicOpenList();
    });
  }
  return w;
}
function musicSync(){
  const w = document.getElementById('musicWidget');
  if(!w) return;
  const playBtn = document.getElementById('mwPlayBtn');
  const muteBtn = document.getElementById('mwMuteBtn');
  const title = document.getElementById('mwTitle');
  const status = document.getElementById('mwStatus');
  if(playBtn) playBtn.innerHTML = Music.playing ? svgPause : svgPlay;
  if(muteBtn) muteBtn.innerHTML = Music.settings.muted ? icon('voloff') : icon('volon');
  const name = musicCurrentName();
  if(title){
    const span = title.querySelector('.mw-track');
    if(span) span.textContent = name;
    title.classList.toggle('paused', !Music.playing);
  }
  if(status){
    const flags = [];
    if(Music.settings.shuffle) flags.push('Acak');
    if(Music.settings.loop) flags.push('Ulang');
    if(!Music.list.length && Music.toneLoop) flags.push('Nada default');
    const state = Music.playing ? 'Putar' : 'Jeda';
    status.textContent = (flags.length ? flags.join(' · ') + ' · ' : '') + state;
  }
}
function musicRefresh(){
  musicWidgetEl();
  musicSync();
}

/* ---------- modal pengaturan playlist ---------- */
function musicOpenList(){
  musicInit();
  closeMusicList();
  const layer = uiLayer();
  const el = document.createElement('div');
  el.className = 'music-modal';
  el.id = 'musicModal';
  el.innerHTML = `
    <div class="music-card">
      <div class="music-head">
        <h3>${icon('music')} Pengaturan Musik</h3>
        <button class="icon-btn" data-music-close aria-label="Tutup">${icon('close')}</button>
      </div>
      <div class="music-opt">
        <button class="music-toggle ${Music.settings.shuffle?'on':''}" data-music-toggle="shuffle">${icon('shuffle')} Acak</button>
        <button class="music-toggle ${Music.settings.loop?'on':''}" data-music-toggle="loop">${icon('repeat')} Ulang</button>
        <button class="music-toggle ${Music.settings.muted?'on':''}" data-music-toggle="mute">${Music.settings.muted?icon('voloff'):icon('volon')} Bisu</button>
      </div>
      <div class="music-vol">
        ${icon('volon')}
        <input type="range" id="musicVol" min="0" max="100" value="${Math.round((Music.settings.volume||0.6)*100)}" aria-label="Volume musik">
      </div>
      <label class="btn btn-gold btn-block" style="margin-bottom:10px;">${icon('upload')} Tambah Lagu (MP3)
        <input type="file" id="musicFileInput" accept="audio/mp3,audio/*" multiple style="display:none;">
      </label>
      <div id="musicListWrap">${renderMusicListHTML()}</div>
      <p class="music-note">File MP3 disimpan di penyimpanan perangkat (IndexedDB) dan bisa diputar offline. ${Music.list.length===0 ? '<br>Belum ada lagu — tambahkan MP3 di atas, atau biarkan <b>Melodi Madin (Nada Default)</b> berbunyi saat aplikasi dibuka.' : ''}</p>
    </div>`;
  el.addEventListener('click', e=>{
    if(e.target === el){ closeMusicList(); return; }
    if(e.target.closest('[data-music-close]')){ closeMusicList(); return; }
    const tgl = e.target.closest('[data-music-toggle]');
    if(tgl){
      const k = tgl.getAttribute('data-music-toggle');
      if(k === 'shuffle') musicToggleShuffle();
      else if(k === 'loop') musicToggleLoop();
      else if(k === 'mute') musicToggleMute();
      renderMusicList();
      return;
    }
    const play = e.target.closest('[data-music-play]');
    if(play){ musicSelectTrack(play.getAttribute('data-music-play')); return; }
    const del = e.target.closest('[data-music-del]');
    if(del){ musicDeleteTrack(del.getAttribute('data-music-del')); return; }
  });
  layer.appendChild(el);
  const fileInput = document.getElementById('musicFileInput');
  if(fileInput) fileInput.addEventListener('change', e=>{ musicAddFiles(e.target.files); e.target.value = ''; });
  const vol = document.getElementById('musicVol');
  if(vol) vol.addEventListener('input', ()=>musicSetVolume(Number(vol.value)/100));
  renderMusicList();
}
function closeMusicList(){
  const el = document.getElementById('musicModal');
  if(el) el.remove();
}
function renderMusicList(){
  const wrap = document.getElementById('musicListWrap');
  if(!wrap) return;
  wrap.innerHTML = renderMusicListHTML();
}
function renderMusicListHTML(){
  const list = musikMeta().slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(!list.length){
    return `<div class="music-empty">${icon('music')}<br>Playlist kosong.<br>Tambahkan file MP3 di atas.</div>`;
  }
  return list.map(t=>`
    <div class="music-track-row">
      ${Music.currentId===t.id ? `<span class="music-now" title="Sedang diputar">${icon('music')}</span>` : ''}
      <div class="music-track-info">
        <div class="music-track-name ${Music.currentId===t.id?'active':''}" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>
        <div class="music-track-size">${fmtFileSize(t.size)}${Music.currentId===t.id ? ' · sedang diputar' : ''}</div>
      </div>
      <button class="icon-btn" data-music-play="${t.id}" title="Putar sekarang">${icon('play')}</button>
      <button class="icon-btn" data-music-del="${t.id}" title="Hapus dari playlist" style="color:var(--status-a);">${icon('trash')}</button>
    </div>`).join('');
}

/* ---------- manajemen playlist (tambah multi MP3, pilih, hapus) ---------- */
async function musicAddFiles(fileList){
  if(!fileList || !fileList.length) return;
  const btn = document.getElementById('musicFileInput');
  const list = musikMeta().slice();
  let added = 0;
  for(const f of fileList){
    const isMp3Like = /^mp3$/i.test((f.name||'').split('.').pop());
    if(f.type && f.type.indexOf('audio') !== 0 && !isMp3Like) continue;
    const id = uid();
    try{ await MusikDB.put({id, blob: f}); }catch(e){ continue; }
    list.push({id, name: f.name || ('Lagu-'+id.slice(-5)), size: f.size, createdAt: Date.now()});
    added++;
  }
  if(added){
    saveMusikMeta(list);
    Music.list = list;
    if(!Music.currentId || !list.some(t=>t.id===Music.currentId)){
      Music.currentId = list[list.length-1].id;
    }
    musicRebuildOrder();
    musicRefresh();
    Music.currentId = list[list.length-1].id;
    musicPlayCurrent(true); // playlist mengambil alih pemutaran (tone default dihentikan)
    renderMusicList();
    showToast(added + ' lagu ditambahkan.', 'success');
  } else {
    showToast('Tidak ada file MP3/audio valid yang dipilih.', 'warn');
  }
  if(btn) btn.value = '';
}
async function musicSelectTrack(id){
  const list = musikMeta();
  if(!list.some(t=>t.id===id)) return;
  Music.currentId = id;
  Music.idx = Music.order.indexOf(id);
  await musicPlayCurrent(true);
  renderMusicList();
}
function musicDeleteTrack(id){
  const meta = musikMeta().find(t=>t.id===id);
  showConfirm(meta ? ('Hapus lagu "' + meta.name + '" dari playlist?') : 'Hapus lagu ini dari playlist?', async ()=>{
    try{ await MusikDB.remove(id); }catch(e){}
    const list = musikMeta().filter(t=>t.id!==id);
    saveMusikMeta(list);
    Music.list = list;
    if(Music.currentId === id){
      if(Music.audio.src){ try{ Music.audio.pause(); }catch(e){} Music.audio.removeAttribute('src'); Music.audio.load(); }
      Music.currentId = null;
      musicStopTone();
      Music.playing = false;
      if(list.length){ Music.currentId = list[0].id; musicPlay(); }
    } else {
      musicRebuildOrder();
    }
    musicRefresh();
    renderMusicList();
    showToast('Lagu dihapus dari playlist.', 'info');
  }, {title:'Hapus Lagu', okText:'Ya, Hapus'});
}

/* ---------------------------- Boot ---------------------------- */
applyEmbeddedData();
cacheFileTemplate(); // simpan salinan template utk fitur "Bagikan Aplikasi" (best-effort)
SC.boot();           // cloud (Supabase): tarik data remote bila lebih baru, lalu unggah lokal
render();
musicBoot(); // nyalakan musik latar (autoplay + fallback sentuhan pertama)
</script>
